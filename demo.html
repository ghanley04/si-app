<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SI Companion</title>
<style>
  /* ===================== THEME TOKENS ===================== */
  :root {
    /* Warm studio (light) */
    --rail-bg:#4B1528; --rail-fg:#E7B9C8; --rail-fg-strong:#FFFFFF; --rail-muted:#B57E93;
    --rail-hover:#5E1B33; --rail-active-soft:#72243E; --rail-border:#5E1B33;
    --accent:#D85A30; --accent-fg:#FFFFFF; --accent-solid-fg:#C24A24;
    --accent-soft-bg:#FBEDE7; --accent-soft-fg:#99381B; --accent-ring:rgba(216,90,48,.16);
    --app-bg:#FCF7F3; --panel-bg:#FFFFFF; --surface-2:#FBF3EC;
    --border:#EEE1D9; --border-strong:#E1CFC4;
    --text:#2B2320; --text-muted:#93796C; --hover-soft:#FBEDE7; --field-bg:#FFFFFF;
    --user-bg:#4B1528; --user-fg:#FFFFFF;
    --ready-bg:#E6F5EC; --ready-fg:#2C7A4B; --danger:#DC2626;
    --info-bg:#FBF3EC; --info-fg:#93796C; --scroll:#E7D9CF;
    --warn-bg:#FBF0DD; --warn-fg:#8A5A12; --bad-bg:#FBE7E4; --bad-fg:#B23A22; --bar-track:#EEE1D9;
    --radius:10px;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  html[data-theme="dark"] {
    /* Focused dark */
    --rail-bg:#171310; --rail-fg:#B7ADA4; --rail-fg-strong:#FAF6F2; --rail-muted:#7C6E63;
    --rail-hover:#221C17; --rail-active-soft:#2A231C; --rail-border:#2A231C;
    --accent:#E0714F; --accent-fg:#1B1613; --accent-solid-fg:#EF9066;
    --accent-soft-bg:#2E2119; --accent-soft-fg:#F0997B; --accent-ring:rgba(224,113,79,.24);
    --app-bg:#1E1915; --panel-bg:#26201B; --surface-2:#221C17;
    --border:#322A22; --border-strong:#3E342A;
    --text:#F1EAE3; --text-muted:#A29387; --hover-soft:#2A231C; --field-bg:#221C17;
    --user-bg:#E0714F; --user-fg:#1B1613;
    --ready-bg:#1F3A2A; --ready-fg:#6FCE97; --danger:#F0776F;
    --info-bg:#221C17; --info-fg:#A29387; --scroll:#3A3129;
    --warn-bg:#33270F; --warn-fg:#E7B25A; --bad-bg:#3A211B; --bad-fg:#F0997B; --bar-track:#322A22;
  }

  * { box-sizing:border-box; transition:background-color .18s ease, border-color .18s ease, color .18s ease; }
  html,body { height:100%; }
  body { margin:0; font-family:var(--font); background:var(--app-bg); color:var(--text);
    line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:99px; border:3px solid transparent; background-clip:content-box; }

  .i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.75;
       stroke-linecap:round; stroke-linejoin:round; display:inline-block; vertical-align:middle; flex-shrink:0; }
  .i-fill { fill:currentColor; stroke:none; }

  /* ===================== APP SHELL ===================== */
  .app { display:grid; grid-template-columns:244px 1fr; height:100vh; }

  /* ---------- SIDE NAV ---------- */
  .rail { background:var(--rail-bg); border-right:1px solid var(--rail-border);
          display:flex; flex-direction:column; height:100vh; }
  .brand { display:flex; align-items:center; gap:11px; padding:20px 18px 14px; }
  .brand .mark { width:32px; height:32px; border-radius:9px; background:var(--accent);
    color:var(--accent-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark .i { width:19px; height:19px; }
  .brand .name { font-size:15.5px; font-weight:650; color:var(--rail-fg-strong); letter-spacing:-.01em; }

  .rail-scroll { flex:1; min-height:0; overflow-y:auto; padding:6px 12px 12px; }
  .nav-group { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
    color:var(--rail-fg); font-size:13.5px; font-weight:500; cursor:pointer; border:0;
    background:transparent; width:100%; text-align:left; font-family:inherit; }
  .nav-item .i { width:18px; height:18px; opacity:.92; }
  .nav-item:hover { background:var(--rail-hover); color:var(--rail-fg-strong); }
  .nav-item.on { background:var(--rail-active-soft); color:var(--rail-fg-strong); }

  .nav-label { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--rail-muted);
    font-weight:600; padding:18px 11px 8px; }

  .course { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    color:var(--rail-fg); font-size:13.5px; font-weight:500; cursor:pointer; }
  .course:hover { background:var(--rail-hover); }
  .course.on { background:var(--rail-active-soft); color:var(--rail-fg-strong);
    border:1px solid var(--rail-border); padding:7px 9px; }
  .course .swatch { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .course.on .swatch { box-shadow:0 0 0 3px rgba(255,255,255,.12); }
  .course .course-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .course .course-del { border:0; background:transparent; color:var(--rail-muted); cursor:pointer;
    padding:2px; border-radius:6px; opacity:0; display:flex; }
  .course .course-del .i { width:14px; height:14px; }
  .course:hover .course-del { opacity:.7; }
  .course .course-del:hover { opacity:1; color:#F0997B; background:var(--rail-hover); }
  .rail-empty { font-size:13px; color:var(--rail-muted); font-style:italic; padding:6px 11px; }

  .rail-foot { border-top:1px solid var(--rail-border); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .user { display:flex; align-items:center; gap:10px; padding:2px 4px; }
  .user .av { width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--accent-fg);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:650; flex-shrink:0; }
  .user .who { font-size:13px; color:var(--rail-fg-strong); font-weight:500; line-height:1.25; }
  .user .who small { display:block; font-size:11px; color:var(--rail-muted); font-weight:400; }
  .foot-row { display:flex; gap:8px; }
  .foot-btn { flex:1; border:1px solid var(--rail-border); background:transparent; color:var(--rail-fg);
    font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer; border-radius:9px;
    padding:8px 10px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .foot-btn:hover { background:var(--rail-hover); color:var(--rail-fg-strong); }
  .foot-btn .i { width:16px; height:16px; }

  /* ---------- MAIN ---------- */
  .main { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--app-bg); }
  .infobar { display:flex; align-items:center; gap:11px; padding:11px 32px; font-size:12.5px;
    color:var(--info-fg); background:var(--info-bg); border-bottom:1px solid var(--border); }
  .infobar .i { color:var(--accent-solid-fg); width:17px; height:17px; }
  .infobar span { flex:1; }
  .infobar strong { color:var(--text); font-weight:600; }
  .infobar .close { border:0; background:transparent; color:var(--info-fg); cursor:pointer; padding:3px; border-radius:6px; display:flex; }
  .infobar .close:hover { background:var(--hover-soft); color:var(--text); }

  #page { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .page-scroll { flex:1; min-height:0; overflow-y:auto; padding:34px 32px 36px; }
  .page-inner { max-width:980px; margin:0 auto; }

  .page-head { display:flex; align-items:flex-start; gap:16px; margin-bottom:26px; }
  .page-title { font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0; color:var(--text); }
  .page-sub { font-size:14px; color:var(--text-muted); margin:7px 0 0; max-width:580px; line-height:1.6; }
  .page-head .btn { margin-left:auto; }

  /* ---------- COURSES GRID ---------- */
  .course-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:16px; }
  .ccard { position:relative; text-align:left; cursor:pointer; background:var(--panel-bg);
    border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column;
    min-height:138px; font-family:inherit; }
  .ccard:hover { border-color:var(--border-strong); box-shadow:0 8px 20px -12px rgba(43,35,32,.3); transform:translateY(-1px); }
  .ccard-top { display:flex; align-items:center; margin-bottom:12px; }
  .ccard-dot { width:11px; height:11px; border-radius:50%; }
  .ccard-del { margin-left:auto; border:0; background:transparent; color:var(--text-muted); cursor:pointer;
    padding:4px; border-radius:7px; opacity:0; display:flex; }
  .ccard:hover .ccard-del { opacity:.6; }
  .ccard-del:hover { opacity:1; color:var(--danger); background:var(--hover-soft); }
  .ccard-del .i { width:16px; height:16px; }
  .ccard-name { font-size:16px; font-weight:650; color:var(--text); }
  .ccard-meta { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .ccard-foot { margin-top:auto; padding-top:14px; font-size:12.5px; font-weight:600;
    color:var(--accent-solid-fg); display:flex; align-items:center; gap:6px; }
  .ccard-foot .i { width:15px; height:15px; }
  .add-ccard { align-items:center; justify-content:center; text-align:center; border:1.5px dashed var(--border-strong);
    background:transparent; color:var(--text-muted); gap:8px; }
  .add-ccard:hover { color:var(--accent-solid-fg); border-color:var(--accent); box-shadow:none; transform:none; }
  .add-ccard .i { width:22px; height:22px; }
  .add-ccard .t { font-size:13.5px; font-weight:600; }

  /* ---------- NEW COURSE FORM ---------- */
  .form-wrap { max-width:520px; margin:0 auto; }
  .back { border:0; background:transparent; color:var(--text-muted); font-family:inherit; font-size:13px;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:6px 2px; }
  .back:hover { color:var(--text); }
  .back .i { width:16px; height:16px; }
  .form-card { background:var(--panel-bg); border:1px solid var(--border); border-radius:16px; padding:28px; margin-top:14px; }
  .form-card .page-title { font-size:21px; }
  .swatch-row { display:flex; gap:10px; margin-top:2px; }
  .sw { width:32px; height:32px; border-radius:9px; cursor:pointer; border:0; padding:0; outline:2px solid transparent; outline-offset:2px; }
  .sw.on { outline-color:var(--text); }
  .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:26px; }

  /* ---------- COURSE DETAIL ---------- */
  .crumb { display:flex; align-items:center; gap:9px; padding:18px 32px 0; font-size:13px; color:var(--text-muted); }
  .crumb .back { padding:2px; }
  .crumb .sep { opacity:.5; }
  .crumb .cur { color:var(--text); font-weight:600; }
  .ctx { display:flex; align-items:flex-start; gap:16px; padding:14px 32px 0; }
  .ctx-title { font-size:22px; font-weight:650; letter-spacing:-.015em; margin:0; color:var(--text); }
  .ctx-meta { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin-top:5px; }
  .ctx-meta .sep { opacity:.5; }
  .ctx-meta .live { display:inline-flex; align-items:center; gap:6px; color:var(--accent-solid-fg); }
  .ctx-meta .live .pulse { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .ctx-actions { margin-left:auto; display:flex; gap:9px; }

  .btn { font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:9px;
    padding:9px 15px; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn .i { width:16px; height:16px; }
  .btn.primary { background:var(--accent); color:var(--accent-fg); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { background:transparent; color:var(--text-muted); border-color:var(--border-strong); }
  .btn.ghost:hover { background:var(--hover-soft); color:var(--text); }

  .tabs { display:flex; padding:16px 32px 0; border-bottom:1px solid var(--border); }
  .tab { font-family:inherit; border:0; background:transparent; cursor:pointer; font-size:13.5px;
    font-weight:600; color:var(--text-muted); padding:10px 2px; margin-right:24px; position:relative; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent-solid-fg); }
  .tab.active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:var(--accent); border-radius:2px; }

  .content { flex:1; min-height:0; overflow-y:auto; padding:26px 32px 30px; }
  .content-inner { max-width:820px; }

  input[type=text], textarea, select {
    width:100%; font-family:inherit; font-size:14px; color:var(--text); background:var(--field-bg);
    border:1px solid var(--border-strong); border-radius:var(--radius); padding:10px 12px; outline:none; }
  input[type=text]::placeholder, textarea::placeholder { color:var(--text-muted); }
  input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
  textarea { resize:vertical; min-height:130px; line-height:1.55; }
  .field-label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }

  .sec-lead { font-size:13.5px; color:var(--text-muted); margin:0 0 20px; max-width:600px; line-height:1.6; }
  .empty { text-align:center; padding:56px 20px; color:var(--text-muted); }
  .empty .i { width:34px; height:34px; color:var(--text-muted); margin-bottom:12px; opacity:.7; }
  .empty .big { font-size:15px; font-weight:600; color:var(--text); }
  .empty .sm { font-size:13px; margin:4px 0 18px; }

  /* materials */
  .mat { display:flex; align-items:center; gap:14px; padding:13px 16px; background:var(--panel-bg);
    border:1px solid var(--border); border-radius:12px; margin-bottom:10px; }
  .mat .fic { width:38px; height:38px; border-radius:9px; background:var(--accent-soft-bg);
    color:var(--accent-soft-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mat .minfo { min-width:0; flex:1; }
  .mat .fname { font-size:14px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mat .fmeta { font-size:12px; color:var(--text-muted); margin-top:1px; }
  .mat .ready { font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--ready-bg); color:var(--ready-fg); display:inline-flex; align-items:center; gap:5px; flex-shrink:0; }
  .mat .ready .d { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .mat .rm { border:0; background:transparent; color:var(--text-muted); cursor:pointer; padding:5px; border-radius:7px; display:flex; }
  .mat .rm:hover { color:var(--danger); background:var(--hover-soft); }
  .mat .rm .i { width:16px; height:16px; }
  .add-card { margin-top:20px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:20px; }
  .add-card h3 { margin:0 0 4px; font-size:14.5px; font-weight:650; color:var(--text); }
  .add-card .hint { font-size:12.5px; color:var(--text-muted); margin:0 0 16px; }
  .add-grid { display:grid; gap:14px; }
  .file-drop { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px dashed var(--border-strong);
    border-radius:11px; color:var(--text-muted); font-size:13px; }
  .file-drop .i { color:var(--accent-solid-fg); }
  .file-drop input[type=file] { font-family:inherit; font-size:12.5px; color:var(--text-muted); }
  .add-actions { display:flex; justify-content:flex-end; }

  /* chat */
  .chat-pane { display:flex; flex-direction:column; min-height:100%; }
  .thread { flex:1; display:flex; flex-direction:column; gap:16px; padding-bottom:16px; }
  .bubble { max-width:80%; font-size:14px; line-height:1.6; padding:12px 15px; }
  .bubble.user { align-self:flex-end; background:var(--user-bg); color:var(--user-fg); border-radius:15px 15px 4px 15px; }
  .bubble.assistant { align-self:flex-start; background:var(--panel-bg); color:var(--text);
    border:1px solid var(--border); border-radius:15px 15px 15px 4px; white-space:pre-wrap; }
  .sources { margin-top:11px; display:flex; gap:7px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--accent-soft-bg); color:var(--accent-soft-fg); display:inline-flex; align-items:center; gap:5px; }
  .chip .i { width:12px; height:12px; }
  .thinking { align-self:flex-start; font-size:13px; color:var(--text-muted); padding:4px 2px; display:flex; align-items:center; gap:8px; }
  .thinking .dots { display:inline-flex; gap:3px; }
  .thinking .dots span { width:5px; height:5px; border-radius:50%; background:var(--text-muted); animation:bounce 1s infinite; }
  .thinking .dots span:nth-child(2){ animation-delay:.15s; }
  .thinking .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100%{ opacity:.3; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-3px);} }
  .composer-wrap { position:sticky; bottom:0; background:var(--app-bg); padding-top:12px; margin-top:auto; }
  .composer { display:flex; gap:10px; align-items:center; padding:7px 7px 7px 16px;
    border:1px solid var(--border-strong); border-radius:13px; background:var(--panel-bg); }
  .composer input { border:0; background:transparent; padding:8px 0; flex:1; }
  .composer input:focus { box-shadow:none; }
  .composer .send { width:38px; height:38px; border:0; border-radius:9px; background:var(--accent);
    color:var(--accent-fg); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .composer .send:hover { filter:brightness(1.06); }
  .composer .send .i { width:19px; height:19px; }

  /* practice */
  .gen-row { display:flex; gap:10px; align-items:center; margin-bottom:8px; padding:7px 7px 7px 16px;
    border:1px solid var(--border-strong); border-radius:13px; background:var(--panel-bg); }
  .gen-row input { border:0; background:transparent; padding:8px 0; flex:1; }
  .gen-row input:focus { box-shadow:none; }
  .session-pick { margin:18px 0 4px; }
  .worksheet { margin-top:22px; background:var(--panel-bg); border:1px solid var(--border); border-radius:14px; padding:2px 24px 24px; }
  .ws-head { padding:20px 0 14px; border-bottom:1px solid var(--border); }
  .ws-head h2 { font-size:18px; font-weight:650; margin:0; color:var(--text); letter-spacing:-.01em; }
  .ws-head .ts { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .ws-block { margin-top:22px; }
  .ws-block .lbl { font-size:11px; letter-spacing:.07em; text-transform:uppercase; font-weight:700;
    color:var(--accent-solid-fg); display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .ws-block .num { width:20px; height:20px; border-radius:6px; background:var(--accent-soft-bg);
    color:var(--accent-soft-fg); font-size:11px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; }
  .q { font-size:14px; color:var(--text); padding:11px 0 11px 28px; position:relative; line-height:1.55; border-top:1px solid var(--border); }
  .q:first-of-type { border-top:0; }
  .q .qn { position:absolute; left:0; top:11px; font-size:13px; color:var(--text-muted); font-weight:600; }
  .q .hint { font-size:12.5px; color:var(--text-muted); margin-top:5px; font-style:italic; }

  /* ---------- tutor ---------- */
  .tutor-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .topic-add { display:flex; gap:8px; align-items:center; }
  .topic-add input { width:230px; }
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:14px; }
  .tcard { position:relative; text-align:left; cursor:pointer; background:var(--panel-bg); width:100%;
    border:1px solid var(--border); border-radius:14px; padding:16px 16px 42px; font-family:inherit; display:flex; flex-direction:column; gap:12px; }
  .tcard:hover { border-color:var(--border-strong); box-shadow:0 8px 20px -12px rgba(43,35,32,.3); transform:translateY(-1px); }
  .tcard-top { display:flex; align-items:center; gap:10px; }

<script>
(function () {
  "use strict";

  // ============================================================
  // CLAUDE CONFIG  —  the API key is NEVER stored in this file.
  // ============================================================
  // getKey() reads the key from (1) an optional injected global
  // window.CLAUDE_API_KEY — e.g. set by a separate, git-ignored
  // config file — or (2) the key you paste via the sidebar "API key"
  // button, which is saved only in this browser's localStorage.
  // Because no key is hardcoded here, it can never be committed or
  // pushed to GitHub.
  var AKEY = "si-companion-apikey";
  function getKey() {
    var injected = (typeof window !== "undefined" && window.CLAUDE_API_KEY) ? String(window.CLAUDE_API_KEY) : "";
    return (injected || localStorage.getItem(AKEY) || "").trim();
  }
  function setKey(k) {
    k = (k || "").trim();
    if (k) localStorage.setItem(AKEY, k); else localStorage.removeItem(AKEY);
  }

  var CLAUDE = {
    model: "claude-opus-4-8",
    maxTokens: 2048
  };

  function claudeReady() { return getKey().length > 0; }

  // Calls the Claude Messages API directly from the browser.
  // opts: { system, user, schema }  (schema => structured JSON output)
  async function callClaude(opts) {
    var body = {
      model: CLAUDE.model,
      max_tokens: CLAUDE.maxTokens,
      messages: [{ role: "user", content: opts.user }]
    };
    if (opts.system) body.system = opts.system;
    if (opts.schema) body.output_config = { format: { type: "json_schema", schema: opts.schema } };

    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("Claude API " + res.status + ": " + (await res.text()));
    var data = await res.json();
    return (data.content || [])
      .filter(function (b) { return b.type === "text"; })
      .map(function (b) { return b.text; })
      .join("");
  }

  var KEY = "si-companion-demo/v1";
  var TKEY = "si-companion-theme";
  var IBKEY = "si-companion-infobar";
  var STOPWORDS = new Set(("the a an and or but of to in on at for with without is are was were be been being " +
    "this that these those it its as by from into about over under how what why when where which who whom whose " +
    "do does did can could should would will shall may might must not no yes if then than so such your you i we they " +
    "he she them his her their our us me my mine ours").split(" "));

  var COLORS = ["#D85A30","#B5477E","#8B5CF6","#3B82C4","#0D9488","#CA8A04"];

  var IC = {
    file:'<svg class="i" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>',
    trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
    x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    spark:'<svg class="i i-fill" viewBox="0 0 24 24"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/></svg>',
    send:'<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    upload:'<svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',
    moon:'<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    inbox:'<svg class="i" viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4M4 13V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg>',
    arrowRight:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
    arrowLeft:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
    key:'<svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 21 2M18 5l2 2M15 8l2 2"/></svg>'
  };

  // ---------- theme ----------
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeToggle");
  var theme = localStorage.getItem(TKEY) || "light";
  function applyTheme(t) {
    if (t === "dark") root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
    themeBtn.innerHTML = (t === "dark" ? IC.sun + "Light mode" : IC.moon + "Dark mode");
  }
  applyTheme(theme);
  themeBtn.onclick = function () {
    theme = (theme === "dark" ? "light" : "dark");
    localStorage.setItem(TKEY, theme); applyTheme(theme);
  };

  // ---------- api key ----------
  var keyBtn = document.getElementById("keyBtn");
  function applyKeyBtn() {
    var set = getKey().length > 0;
    var injected = typeof window !== "undefined" && !!window.CLAUDE_API_KEY;
    keyBtn.innerHTML = IC.key + (set ? (injected ? "Key from config" : "API key set") : "Add API key");
    keyBtn.title = set
      ? (injected ? "Key is supplied by window.CLAUDE_API_KEY" : "A key is saved in this browser. Click to change or remove it.")
      : "No key yet — click to paste your Anthropic API key.";
  }
  applyKeyBtn();
  keyBtn.onclick = function () {
    if (typeof window !== "undefined" && window.CLAUDE_API_KEY) {
      alert("A key is being supplied by window.CLAUDE_API_KEY (e.g. a git-ignored config file). Remove that to manage the key here instead.");
      return;
    }
    var cur = getKey();
    var v = prompt("Paste your Anthropic API key.\n\nIt is saved only in this browser (localStorage) — never written into demo.html, so it can't be committed or pushed to GitHub. Leave blank to remove it.", cur);
    if (v === null) return;
    setKey(v); applyKeyBtn(); render();
  };

  // ---------- infobar ----------
  var infobar = document.getElementById("infobar");
  if (localStorage.getItem(IBKEY) === "dismissed") infobar.style.display = "none";
  document.getElementById("infobarClose").onclick = function () {
    infobar.style.display = "none"; localStorage.setItem(IBKEY, "dismissed");
  };

  // ---------- state ----------
  var state = load();
  var view = { page: "courses", courseId: null, tab: "materials", activeSession: null,
    tutorMode: "hub", tutorTopic: null };

  function load() {
    var s = null;
    try { var raw = localStorage.getItem(KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
    if (!s) s = seed();
    (s.courses || []).forEach(normalizeCourse);
    return s;
  }
  // Ensure older saved courses gain the tutor-mode fields.
  function normalizeCourse(c) {
    if (!c.materials) c.materials = [];
    if (!c.chat) c.chat = [];
    if (!c.sessions) c.sessions = [];
    if (!c.topics) c.topics = [];
    if (!c.questions) c.questions = [];
    if (!c.attempts) c.attempts = [];
    if (!c.progress) c.progress = {};
    return c;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function seed() {
    return {
      courses: [{
        id: uid(), name: "CHEM 116 (sample)", color: COLORS[0],
        materials: [{
          id: uid(), filename: "equilibrium-notes.txt",
          text: "Chemical equilibrium is the state in which the forward and reverse reaction rates are equal, " +
                "so concentrations of reactants and products stay constant over time. The equilibrium constant K " +
                "relates product and reactant concentrations at equilibrium. A large K means products are favored; " +
                "a small K means reactants are favored.\n\n" +
                "Le Chatelier's principle states that if a system at equilibrium is disturbed by a change in " +
                "concentration, temperature, or pressure, the system shifts to counteract the disturbance and " +
                "restore equilibrium. Adding reactant shifts the equilibrium toward products. Increasing temperature " +
                "for an endothermic reaction shifts it toward products. Increasing pressure shifts equilibrium toward " +
                "the side with fewer moles of gas.\n\n" +
                "The reaction quotient Q has the same form as K but uses current concentrations. If Q < K the reaction " +
                "proceeds forward; if Q > K it proceeds in reverse; if Q equals K the system is at equilibrium.",
          createdAt: Date.now()
        }],
        chat: [], sessions: [],
        topics: [
          { id: uid(), name: "Chemical equilibrium", source: "ai" },
          { id: uid(), name: "Le Chatelier's principle", source: "ai" },
          { id: uid(), name: "Reaction quotient Q", source: "ai" }
        ],
        questions: [], attempts: [], progress: {}
      }]
    };
  }

  function currentCourse() { return state.courses.find(function (c) { return c.id === view.courseId; }) || null; }
  function courseColor(c) { return c.color || COLORS[(state.courses.indexOf(c) < 0 ? 0 : state.courses.indexOf(c)) % COLORS.length]; }

  // ---------- retrieval (stand-in for embeddings + LLM) ----------
  function tokenize(s) {
    return (s.toLowerCase().match(/[a-z0-9']+/g) || []).filter(function (w) { return w.length > 2 && !STOPWORDS.has(w); });
  }
  function splitChunks(text) {
    return text.split(/(?<=[.!?])\s+|\n+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 25; });
  }
  function allChunks(course) {
    var out = [];
    course.materials.forEach(function (m, mi) {
      splitChunks(m.text).forEach(function (c) { out.push({ text: c, filename: m.filename, materialIndex: mi }); });
    });
    return out;
  }
  function rank(chunks, query, limit) {
    var q = tokenize(query); if (q.length === 0) return [];
    var qset = new Set(q);
    return chunks.map(function (c) {
      var toks = tokenize(c.text), score = 0;
      toks.forEach(function (t) { if (qset.has(t)) score++; });
      return { chunk: c, score: score };
    }).filter(function (r) { return r.score > 0; })
      .sort(function (a, b) { return b.score - a.score; }).slice(0, limit || 3);
  }
  async function answerQuestion(course, question) {
    if (course.materials.length === 0)
      return { content: "No materials have been uploaded for this course yet. Add some material first — I only answer from what's uploaded.", citations: [] };
    var ranked = rank(allChunks(course), question, 3);
    var citations = ranked.map(function (r, i) { return { index: i + 1, filename: r.chunk.filename, text: r.chunk.text }; });

    // No API key configured → fall back to keyword-matched excerpts.
    if (!claudeReady()) {
      if (ranked.length === 0)
        return { content: "I couldn't find anything in the uploaded materials that answers that. Add your Anthropic API key at the top of the file for real Claude answers, or try rephrasing.", citations: [] };
      var body = "Based on the course materials:\n\n" + citations.map(function (c) { return "[" + c.index + "] " + c.text; }).join("\n\n");
      return { content: body, citations: citations };
    }

    // Ground Claude in every uploaded material for this course.
    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var system = "You are an SI (Supplemental Instruction) study companion. Answer the student's question using ONLY the course materials provided. If the materials don't cover it, say so plainly. Be concise, clear, and encouraging.";
    var user = "COURSE MATERIALS:\n" + context + "\n\nSTUDENT QUESTION: " + question;
    var content = await callClaude({ system: system, user: user });
    return { content: content, citations: citations };
  }
  async function generateSession(course, topic) {
    var t = topic.trim();
    if (!claudeReady()) return localGenerateSession(course, t);

    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var schema = {
      type: "object",
      properties: {
        warmUp: { type: "array", items: { type: "string" } },
        groupProblems: { type: "array", items: {
          type: "object",
          properties: { prompt: { type: "string" }, hint: { type: "string" } },
          required: ["prompt", "hint"], additionalProperties: false
        } },
        wrapUpCheck: { type: "array", items: { type: "string" } }
      },
      required: ["warmUp", "groupProblems", "wrapUpCheck"], additionalProperties: false
    };
    var system = "You design Purdue-style Supplemental Instruction practice sessions: a warm-up recall section, collaborative group problems (each with a facilitation hint), and a wrap-up check. Ground every item in the provided course materials. Aim for 3 warm-up questions, 2-3 group problems, and 3 wrap-up checks.";
    var user = "COURSE MATERIALS:\n" + context + "\n\nSESSION TOPIC: " + t + "\n\nDesign a practice session on this topic, grounded in the materials.";
    var raw = await callClaude({ system: system, user: user, schema: schema });
    return { id: uid(), topic: t, createdAt: Date.now(), content: JSON.parse(raw) };
  }

  function localGenerateSession(course, topic) {
    var ranked = rank(allChunks(course), topic, 6);
    var facts = ranked.map(function (r) { return r.chunk.text; });
    if (facts.length === 0) facts = allChunks(course).slice(0, 6).map(function (c) { return c.text; });
    function pick(n) { return facts[n % Math.max(facts.length, 1)] || "the uploaded material"; }
    var t = topic.trim();
    var warmUp = [
      "In one sentence, define or describe " + t + " in your own words.",
      "Recall from the material: " + shorten(pick(0)),
      "What is one key term related to " + t + ", and what does it mean?"
    ];
    var groupProblems = [
      { prompt: "Work through this together: apply " + t + " to a concrete example. Reference: " + shorten(pick(1)),
        hint: "Start by identifying what's being asked, then map it to the definition from the notes." },
      { prompt: "Compare two situations involving " + t + " and explain why they differ. Reference: " + shorten(pick(2)),
        hint: "Focus on which variable changes between the two cases." }
    ];
    var wrapUpCheck = [
      "Can each person state the main idea of " + t + " without looking at notes?",
      "What was the trickiest part of today's problems, and how did the group resolve it?",
      "Name one thing you'll review before the next class about " + t + "."
    ];
    return { id: uid(), topic: t, createdAt: Date.now(),
      content: { warmUp: warmUp, groupProblems: groupProblems, wrapUpCheck: wrapUpCheck } };
  }
  function shorten(s) { s = s.replace(/\s+/g, " ").trim(); return s.length > 140 ? s.slice(0, 137) + "…" : s; }

  // ============================================================
  // TUTOR MODE  (adaptive practice — see docs/tutor-mode-design.md)
  // ============================================================
  // Gate constants from the design doc. Demo-tuned lower than the
  // production defaults (WINDOW 10 / MIN_ATTEMPTS 8) so a level can be
  // cleared in a few questions while you click around.
  var TUTOR = { OK_WEIGHT: 0.5, WINDOW: 8, MIN_ATTEMPTS: 4, PASS: 0.80 };
  var LEVELS = ["easy", "medium", "hard"];
  var LEVEL_LABEL = { easy: "Easy", medium: "Medium", hard: "Hard" };
  var tutorRun = null; // transient runner state; never persisted

  function gradePoints(g) { return g === "correct" ? 1 : g === "ok" ? TUTOR.OK_WEIGHT : 0; }
  function nextLevel(l) { return l === "easy" ? "medium" : "hard"; }
  function topicLevel(course, topic) { return course.progress[topic] || "easy"; }

  function confirmedAttempts(course, topic, level) {
    return course.attempts
      .filter(function (a) { return a.topic === topic && a.confirmed && (level == null || a.difficulty === level); })
      .sort(function (a, b) { return a.createdAt - b.createdAt; });
  }

  // Rolling mastery over the last WINDOW confirmed attempts at a level.
  function masteryAt(course, topic, level) {
    var win = confirmedAttempts(course, topic, level).slice(-TUTOR.WINDOW);
    if (win.length === 0) return { pct: 0, count: 0, ready: false };
    var pts = win.reduce(function (s, a) { return s + gradePoints(a.finalGrade); }, 0);
    var pct = pts / win.length;
    return { pct: pct, count: win.length, ready: win.length >= TUTOR.MIN_ATTEMPTS && pct >= TUTOR.PASS };
  }

  // The 80% gate. Advances one tier when ready; never demotes.
  function recomputeProgress(course, topic) {
    var level = topicLevel(course, topic);
    if (level === "hard") return false;
    if (masteryAt(course, topic, level).ready) { course.progress[topic] = nextLevel(level); return true; }
    return false;
  }

  function topicStats(course, topic) {
    var level = topicLevel(course, topic);
    var m = masteryAt(course, topic, level);
    var total = confirmedAttempts(course, topic, null).length;
    var status;
    if (total === 0) status = "new";
    else if (level === "hard" && m.ready) status = "mastered";
    else if (m.count >= TUTOR.WINDOW && m.pct < TUTOR.PASS) status = "stuck";
    else if (m.pct >= TUTOR.PASS) status = "ontrack";
    else status = "work";
    return { level: level, mastery: m, total: total, status: status };
  }

  // Weakest topics first: in-progress (by mastery) → not started → mastered.
  function sortedTopics(course) {
    function rank(s) { return s.status === "mastered" ? 2 : s.status === "new" ? 1 : 0; }
    return course.topics.slice().sort(function (a, b) {
      var sa = topicStats(course, a.name), sb = topicStats(course, b.name);
      if (rank(sa) !== rank(sb)) return rank(sa) - rank(sb);
      return sa.mastery.pct - sb.mastery.pct;
    });
  }

  function pickUnattempted(course, topic, level) {
    var seen = {};
    course.attempts.forEach(function (a) { seen[a.questionId] = true; });
    return course.questions.find(function (q) {
      return q.topic === topic && q.difficulty === level && !seen[q.id];
    }) || null;
  }

  // ----- AI (with offline fallbacks) -----
  async function generateQuestions(course, topic, level, count) {
    if (!claudeReady()) return localGenerateQuestions(course, topic, level, count);
    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var schema = { type: "object", properties: { questions: { type: "array", items: {
      type: "object",
      properties: { stem: { type: "string" }, answer: { type: "string" }, solution: { type: "string" } },
      required: ["stem", "answer", "solution"], additionalProperties: false } } },
      required: ["questions"], additionalProperties: false };
    var system = "You are an adaptive tutor. Write free-response practice questions grounded ONLY in the provided course materials. Difficulty: easy = direct recall or a one-step application of a single idea; medium = combine 2-3 ideas or a multi-step calculation; hard = multi-step reasoning, synthesis across ideas, or transfer to a new situation. For each question give: stem (the question a student answers in words), answer (the concise correct final answer), and solution (a short worked explanation that serves as the answer key). Do not reference figures or images.";
    var user = "COURSE MATERIALS:\n" + context + "\n\nTOPIC: " + topic + "\nDIFFICULTY: " + level +
      "\n\nWrite " + count + " distinct " + level + " questions on this topic, grounded in the materials.";
    var parsed = JSON.parse(await callClaude({ system: system, user: user, schema: schema }));
    return parsed.questions || [];
  }

  async function gradeAnswer(stem, answerKey, response) {
    if (!claudeReady()) return localGrade(answerKey, response);
    var schema = { type: "object", properties: {
      grade: { type: "string", enum: ["correct", "ok", "wrong"] },
      feedback: { type: "string" } }, required: ["grade", "feedback"], additionalProperties: false };
    var system = "You grade a student's free-response answer against an answer key. Choose exactly one grade: 'correct' = the answer is right; 'ok' = the method or setup is right but there's a minor slip such as an arithmetic error or small omission; 'wrong' = incorrect or missing the key idea. Give one or two sentences of specific, encouraging feedback. The student can override your grade, so be fair.";
    var user = "QUESTION:\n" + stem + "\n\nANSWER KEY:\n" + answerKey + "\n\nSTUDENT ANSWER:\n" + response + "\n\nGrade it.";
    return JSON.parse(await callClaude({ system: system, user: user, schema: schema }));
  }

  async function extractTopics(course) {
    if (!claudeReady()) return localExtractTopics(course);
    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var schema = { type: "object", properties: { topics: { type: "array", items: { type: "string" } } },
      required: ["topics"], additionalProperties: false };
    var system = "Extract a concise list of study topics from the course materials. Return 4-8 short topic names (2-5 words each) covering the main ideas a student could practice. No numbering, no duplicates.";
    return JSON.parse(await callClaude({ system: system, user: "COURSE MATERIALS:\n" + context, schema: schema })).topics || [];
  }

  function localGenerateQuestions(course, topic, level, count) {
    var ranked = rank(allChunks(course), topic, count + 2);
    var facts = ranked.length ? ranked.map(function (r) { return r.chunk.text; })
      : allChunks(course).slice(0, count).map(function (c) { return c.text; });
    if (facts.length === 0) facts = ["the uploaded course material"];
    var out = [];
    for (var i = 0; i < count; i++) {
      var fact = facts[i % facts.length], stem;
      if (level === "easy") stem = "In your own words, define or state the key idea of \"" + topic + "\" from the notes.";
      else if (level === "medium") stem = "Apply " + topic + " to explain this situation: " + shorten(fact);
      else stem = "Analyze a scenario involving " + topic + " and justify your reasoning step by step, connecting it to: " + shorten(fact);
      out.push({ stem: stem, answer: shorten(fact), solution: fact });
    }
    return out;
  }

  function localGrade(answerKey, response) {
    var rt = tokenize(response);
    if (rt.length === 0) return { grade: "wrong", feedback: "No answer was entered." };
    var kt = new Set(tokenize(answerKey)), hit = 0;
    rt.forEach(function (t) { if (kt.has(t)) hit++; });
    var ratio = kt.size ? hit / kt.size : 0;
    var grade = ratio > 0.35 ? "correct" : ratio > 0.15 ? "ok" : "wrong";
    return { grade: grade, feedback: "Offline estimate (no API key): your answer overlapped about " +
      Math.round(ratio * 100) + "% with the key — confirm or override the grade yourself." };
  }

  function localExtractTopics(course) {
    var freq = {};
    allChunks(course).forEach(function (c) {
      tokenize(c.text).forEach(function (t) { if (t.length > 4) freq[t] = (freq[t] || 0) + 1; });
    });
    return Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 6)
      .map(function (t) { return t.charAt(0).toUpperCase() + t.slice(1); });
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var courseList = document.getElementById("courseList");
  var pageEl = document.getElementById("page");

  function navigate(v) { Object.assign(view, v); render(); }
  function render() { renderNav(); renderPage(); }

    });

      courseList.innerHTML = '<div class="rail-empty">No courses yet.</div>';
      return;

    courseList.innerHTML = state.courses.map(function (c) {
      var on = view.page === "course" && c.id === view.courseId;
      return '<div class="course ' + (on ? "on" : "") + '" data-id="' + c.id + '">' +
        '<span class="swatch" style="background:' + courseColor(c) + '"></span>' +

        '<button class="course-del" data-del="' + c.id + '" title="Delete course" aria-label="Delete course">' + IC.x + '</button>' +
        '</div>';
    }).join("");
  }

    else if (view.page === "course" && currentCourse()) pageEl.innerHTML = detailPage(currentCourse());
    else { view.page = "courses"; pageEl.innerHTML = coursesPage(); }
    wirePage();

  function detailPage(course) {

      '<button class="back" data-nav-btn="courses">' + IC.arrowLeft + '</button>' +

    var ctx = '<div class="ctx"><div>' +
        '<h1 class="ctx-title">' + esc(course.name) + '</h1>' +
        '<div class="ctx-meta"><span>' + mats + ' material' + (mats === 1 ? '' : 's') + '</span>' +
          '<span class="sep">·</span><span class="live"><span class="pulse"></span>Grounded answers on</span></div>' +
      '</div><div class="ctx-actions">' +
        '<button class="btn ghost" data-goto="materials">' + IC.plus + 'Add material</button>' +
        '<button class="btn primary" data-goto="sessions">' + IC.spark + 'New session</button>' +
      '</div></div>';
    var tabs = '<div class="tabs">' + tabBtn("materials", "Materials") + tabBtn("tutor", "Tutor") + tabBtn("chat", "Chat") + tabBtn("sessions", "Practice sessions") + '</div>';
    var body;
    if (view.tab === "materials") body = renderMaterials(course);
    else if (view.tab === "tutor") body = renderTutor(course);
    else if (view.tab === "chat") body = renderChat(course);
    else body = renderSessions(course);
    return crumb + ctx + tabs + '<div class="content">' + body + '</div>';
  }
  function tabBtn(id, label) {
    return '<button class="tab ' + (view.tab === id ? "active" : "") + '" data-tab="' + id + '">' + label + '</button>';
  }

  function renderMaterials(course) {
    var list = course.materials.length === 0
      ? '<div class="empty" style="padding:40px 20px">' + IC.file + '<div class="big">Nothing uploaded yet</div><div class="sm">Add your first material below.</div></div>'
      : course.materials.map(function (m) {
          return '<div class="mat"><div class="fic">' + IC.file + '</div>' +
            '<div class="minfo"><div class="fname">' + esc(m.filename) + '</div>' +
              '<div class="fmeta">' + m.text.length.toLocaleString() + ' characters · added ' +
              new Date(m.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + '</div></div>' +
            '<span class="ready"><span class="d"></span>Ready</span>' +
            '<button class="rm" data-delmat="' + m.id + '" aria-label="Remove material">' + IC.trash + '</button></div>';
        }).join("");
    return '<div class="content-inner">' +
      '<p class="sec-lead">Chat and practice sessions only draw from what\'s added here. Upload lecture notes, slides, or problem sets and every answer stays grounded in your material.</p>' + list +
      '<div class="add-card"><h3>Add material</h3>' +
        '<p class="hint">Paste text or load a .txt / .md file. The full app extracts text from PDFs and images too.</p>' +
        '<div class="add-grid">' +
          '<div><label class="field-label" for="matName">File name</label><input type="text" id="matName" placeholder="lecture-3.txt" /></div>' +
          '<div><label class="field-label" for="matText">Material text</label><textarea id="matText" placeholder="Paste lecture notes or slide text here…"></textarea></div>' +
          '<div class="file-drop">' + IC.upload + '<input type="file" id="matFile" accept=".txt,.md" /></div>' +
          '<div class="add-actions"><button class="btn primary" id="addMatBtn">' + IC.plus + 'Add material</button></div>' +
        '</div></div></div>';
  }

  function renderChat(course) {
    var log = course.chat.length === 0
      ? '<div class="empty" style="padding:48px 20px">' + IC.spark + '<div class="big">Ask about this course</div><div class="sm">Answers are grounded in whatever materials you\'ve uploaded.</div></div>'
      : course.chat.map(function (m) {
          var src = (m.citations && m.citations.length)
            ? '<div class="sources">' + m.citations.map(function (c) { return '<span class="chip">' + IC.file + '[' + c.index + '] ' + esc(c.filename) + '</span>'; }).join("") + '</div>'
            : "";
          return '<div class="bubble ' + m.role + '">' + esc(m.content) + src + '</div>';
        }).join("");
    return '<div class="chat-pane"><div class="thread" id="chatLog">' + log + '</div>' +
      '<div class="composer-wrap"><div class="composer">' +
        '<input type="text" id="chatInput" placeholder="Ask about this course…" />' +
        '<button class="send" id="sendBtn" aria-label="Send">' + IC.send + '</button>' +

  }

  function renderSessions(course) {
    var picker = "";
    if (course.sessions.length > 0) {
      picker = '<div class="session-pick"><label class="field-label">Saved sessions</label><select id="sessionSelect">' +
        course.sessions.map(function (s) { return '<option value="' + s.id + '">' + esc(s.topic) + ' — ' + new Date(s.createdAt).toLocaleString() + '</option>'; }).join("") + '</select></div>';
    }
    var worksheet = "";
    var active = course.sessions[course.sessions.length - 1];
    if (view.activeSession) active = course.sessions.find(function (s) { return s.id === view.activeSession; }) || active;
    if (active) worksheet = renderWorksheet(active);
    return '<div class="content-inner">' +
      '<p class="sec-lead">Generate a Purdue SI-style practice session — warm-up recall, group problems, and a wrap-up check — grounded in this course\'s material.</p>' +
      '<div class="gen-row"><input type="text" id="topicInput" placeholder="Topic, e.g. Le Chatelier\'s principle" />' +
        '<button class="btn primary" id="genBtn">' + IC.spark + 'Generate session</button></div>' +
      picker + worksheet + '</div>';
  }

  function renderWorksheet(s) {
    var c = s.content;
    function items(arr) {
      return arr.map(function (q, i) { return '<div class="q"><span class="qn">' + String.fromCharCode(97 + i) + '.</span>' + esc(q) + '</div>'; }).join("");
    }
    var gp = c.groupProblems.map(function (p, i) {
      return '<div class="q"><span class="qn">' + String.fromCharCode(97 + i) + '.</span>' + esc(p.prompt) +
        (p.hint ? '<div class="hint">Hint: ' + esc(p.hint) + '</div>' : '') + '</div>';
    }).join("");
    return '<div class="worksheet"><div class="ws-head"><h2>' + esc(s.topic) + '</h2>' +
        '<div class="ts">Generated ' + new Date(s.createdAt).toLocaleString() + '</div></div>' +
      '<div class="ws-block"><div class="lbl"><span class="num">1</span>Warm-up recall</div>' + items(c.warmUp) + '</div>' +
      '<div class="ws-block"><div class="lbl"><span class="num">2</span>Group problems</div>' + gp + '</div>' +
      '<div class="ws-block"><div class="lbl"><span class="num">3</span>Wrap-up check</div>' + items(c.wrapUpCheck) + '</div></div>';
  }

  // ---------- tutor rendering ----------
  function levelBadge(level) { return '<span class="lvbadge lv-' + level + '">' + LEVEL_LABEL[level] + '</span>'; }
  function masteryBar(m) {
    return '<div class="mbar"><div class="mbar-fill" style="width:' + Math.round(m.pct * 100) + '%"></div><div class="mbar-mark"></div></div>';
  }
  function gradeLabel(g) { return g === "correct" ? "Correct" : g === "ok" ? "Minor slip" : "Wrong"; }
  function tutorFlag(st) {
    if (st.status === "new") return { cls: "f-new", text: "Not started" };
    if (st.status === "mastered") return { cls: "f-good", text: "Mastered" };
    if (st.status === "stuck") return { cls: "f-bad", text: "Stuck — review" };
    if (st.status === "ontrack") return { cls: "f-good", text: "Almost there" };
    return { cls: "f-warn", text: "Needs work" };
  }

  function renderTutor(course) {
    var mode = view.tutorMode || "hub";
    if (mode === "run" && view.tutorTopic) return renderRunner(course);
    if (mode === "review") return renderReview(course);
    return renderHub(course);
  }

  function renderHub(course) {
    var hasHistory = course.attempts.some(function (a) { return a.confirmed; });
    var addRow = '<div class="tutor-actions">' +
        '<button class="btn primary" id="extractBtn">' + IC.spark + 'Extract topics with AI</button>' +
        '<div class="topic-add"><input type="text" id="newTopic" placeholder="Or add a topic by hand…" />' +
          '<button class="btn ghost" id="addTopicBtn">' + IC.plus + 'Add</button></div>' +
        (hasHistory ? '<button class="btn ghost" id="reviewBtn" style="margin-left:auto">' + IC.file + 'Answer key</button>' : '') +
      '</div>';
    if (course.topics.length === 0) {
      return '<div class="content-inner">' +
        '<p class="sec-lead">Practice adaptively: answer questions on a topic, self-check against the answer key, and unlock harder questions as you reach 80% mastery. Start by pulling topics from your materials.</p>' +
        addRow +
        '<div class="empty" style="padding:44px 20px">' + IC.inbox +
          '<div class="big">No topics yet</div><div class="sm">Extract them from your materials with AI, or add your own above.</div></div></div>';
    }
    var cards = sortedTopics(course).map(function (t) {
      var st = topicStats(course, t.name), flag = tutorFlag(st), pct = Math.round(st.mastery.pct * 100);
      return '<button class="tcard" data-practice="' + esc(t.name) + '">' +
        '<div class="tcard-top"><span class="tcard-name">' + esc(t.name) + '</span>' + levelBadge(st.level) + '</div>' +
        masteryBar(st.mastery) +
        '<div class="tcard-foot"><span class="tflag ' + flag.cls + '">' + flag.text + '</span>' +
          '<span class="tcard-pct">' + (st.total ? pct + '% at ' + LEVEL_LABEL[st.level] : "Not started") + '</span></div>' +
        '<span class="tcard-go">Practice ' + IC.arrowRight + '</span></button>';
    }).join("");
    return '<div class="content-inner">' +
      '<p class="sec-lead">Weakest topics first. Each shows your current difficulty tier and mastery toward the 80% gate that unlocks the next tier.</p>' +
      addRow + '<div class="topic-grid">' + cards + '</div></div>';
  }

  function renderRunner(course) {
    var topic = view.tutorTopic, level = topicLevel(course, topic);
    var m = masteryAt(course, topic, level), pct = Math.round(m.pct * 100);
    var head = '<div class="run-head">' +
        '<button class="back" id="runBack">' + IC.arrowLeft + 'All topics</button>' +
        '<button class="btn ghost" id="reviewBtn" style="margin-left:auto">' + IC.file + 'Answer key</button></div>' +
      '<div class="run-title"><h2>' + esc(topic) + '</h2>' + levelBadge(level) + '</div>' +
      '<div class="run-progress">' + masteryBar(m) +
        '<div class="run-meta">Mastery ' + pct + '% · ' + m.count + ' of ' + TUTOR.MIN_ATTEMPTS +
        ' answered · reach 80% to unlock ' + (level === "hard" ? "full mastery" : LEVEL_LABEL[nextLevel(level)]) + '</div></div>';

    var banner = (tutorRun && tutorRun.leveledUp)
      ? '<div class="levelup">' + IC.spark + 'Nice — you unlocked <strong>' + LEVEL_LABEL[tutorRun.leveledUp] + '</strong> questions on this topic.</div>' : "";

    var phase = tutorRun ? tutorRun.phase : "loading", body;
    if (phase === "loading" || phase === "grading") {
      body = '<div class="qcard"><div class="thinking">' + (phase === "grading" ? "Grading your answer" : "Preparing a question") +
        '<span class="dots"><span></span><span></span><span></span></span></div></div>';
    } else if (phase === "error") {
      body = '<div class="qcard"><p class="sec-lead" style="margin:0">Couldn\'t prepare a question. Add materials (or an API key) and try again.</p></div>';
    } else if (phase === "question") {
      body = '<div class="qcard"><div class="qstem">' + esc(tutorRun.question.stem) + '</div>' +
        '<textarea id="answerBox" placeholder="Type your answer…">' + esc(tutorRun.response || "") + '</textarea>' +
        '<div class="qactions"><button class="btn primary" id="submitAns">Submit answer</button></div></div>';
    } else {
      var q = tutorRun.question;
      body = '<div class="qcard"><div class="qstem">' + esc(q.stem) + '</div>' +
        '<div class="your-ans"><div class="mini-lbl">Your answer</div>' + esc(tutorRun.response) + '</div>' +
        '<div class="ans-key"><div class="mini-lbl">Answer key</div><div class="ak-answer">' + esc(q.answer) +
          '</div><div class="ak-sol">' + esc(q.solution) + '</div></div>' +
        '<div class="ai-feedback"><div class="mini-lbl">Tutor feedback</div>' + esc(tutorRun.feedback || "") + '</div>' +
        '<div class="grade-pick"><div class="mini-lbl">How did you do? Confirm or change the grade.</div>' +
          '<div class="gbtns">' + gradeBtn("correct", "Correct") + gradeBtn("ok", "Right method, minor slip") + gradeBtn("wrong", "Wrong") + '</div></div>' +
        '<div class="qactions"><button class="btn primary" id="confirmGrade">Confirm &amp; next</button></div></div>';
    }
    return '<div class="content-inner tutor-run">' + head + banner + body + '</div>';
  }
  function gradeBtn(g, label) {
    var on = tutorRun && tutorRun.chosen === g, ai = tutorRun && tutorRun.aiGrade === g;
    return '<button class="gbtn g-' + g + (on ? " on" : "") + '" data-grade="' + g + '">' + esc(label) +
      (ai ? '<span class="ai-tag">AI</span>' : '') + '</button>';
  }

  function renderReview(course) {
    var atts = course.attempts.filter(function (a) { return a.confirmed; })
      .sort(function (a, b) { return b.createdAt - a.createdAt; });
    var head = '<div class="run-head"><button class="back" id="runBack">' + IC.arrowLeft + 'All topics</button></div>' +
      '<div class="run-title"><h2>Answer key &amp; history</h2></div>';
    if (atts.length === 0)
      return '<div class="content-inner">' + head + '<div class="empty" style="padding:40px 20px">' + IC.file +
        '<div class="big">No answered questions yet</div><div class="sm">Practice a topic to build your review log.</div></div></div>';
    var rows = atts.map(function (a) {
      var q = course.questions.find(function (x) { return x.id === a.questionId; }) || {};
      return '<div class="rev"><div class="rev-top">' + levelBadge(a.difficulty) +
          '<span class="rev-topic">' + esc(a.topic) + '</span>' +
          '<span class="gpill g-' + a.finalGrade + '">' + gradeLabel(a.finalGrade) + (a.overridden ? " · you set" : "") + '</span></div>' +
        '<div class="rev-stem">' + esc(q.stem || "") + '</div>' +
        '<div class="your-ans"><div class="mini-lbl">Your answer</div>' + esc(a.response) + '</div>' +
        '<div class="ans-key"><div class="mini-lbl">Answer key</div><div class="ak-answer">' + esc(q.answer || "") +
          '</div><div class="ak-sol">' + esc(q.solution || "") + '</div></div></div>';
    }).join("");
    return '<div class="content-inner">' + head + '<div class="rev-list">' + rows + '</div></div>';
  }

  // ---------- tutor flow ----------
  function startPractice(course, topic) {
    view.tutorMode = "run"; view.tutorTopic = topic;
    tutorRun = { topic: topic, phase: "loading", loading: false, leveledUp: null };
    renderPage();
  }

  async function loadNextQuestion(course) {
    var topic = tutorRun.topic, level = topicLevel(course, topic);
    var q = pickUnattempted(course, topic, level);
    if (!q) {
      try {
        (await generateQuestions(course, topic, level, 4)).forEach(function (item) {
          course.questions.push({ id: uid(), topic: topic, difficulty: level,
            stem: item.stem, answer: item.answer, solution: item.solution });
        });
        persist();
        q = pickUnattempted(course, topic, level);
      } catch (e) {
        if (tutorRun) { tutorRun.phase = "error"; tutorRun.loading = false; renderPage(); }
        return;
      }
    }
    if (!tutorRun) return;
    tutorRun.question = q; tutorRun.response = ""; tutorRun.aiGrade = null;
    tutorRun.feedback = ""; tutorRun.chosen = null;
    tutorRun.phase = q ? "question" : "error"; tutorRun.loading = false;
    renderPage();
  }

  async function submitAnswer(course) {
    tutorRun.leveledUp = null; tutorRun.phase = "grading"; renderPage();
    var q = tutorRun.question;
    try {
      var res = await gradeAnswer(q.stem, q.answer + "\n" + q.solution, tutorRun.response);
      tutorRun.aiGrade = res.grade; tutorRun.feedback = res.feedback; tutorRun.chosen = res.grade;
    } catch (e) {
      tutorRun.aiGrade = "ok"; tutorRun.chosen = "ok";
      tutorRun.feedback = "Couldn't reach the grader (" + e.message + ") — grade yourself.";
    }
    tutorRun.phase = "graded"; renderPage();
  }

  function confirmGrade(course) {
    var q = tutorRun.question, topic = tutorRun.topic, level = topicLevel(course, topic);
    var g = tutorRun.chosen || tutorRun.aiGrade || "ok";
    course.attempts.push({ id: uid(), questionId: q.id, topic: topic, difficulty: level,
      response: tutorRun.response, aiGrade: tutorRun.aiGrade, finalGrade: g,
      overridden: g !== tutorRun.aiGrade, confirmed: true, feedback: tutorRun.feedback, createdAt: Date.now() });
    var before = topicLevel(course, topic);
    recomputeProgress(course, topic);
    var after = topicLevel(course, topic);
    persist();
    tutorRun.phase = "loading"; tutorRun.loading = true;
    tutorRun.leveledUp = (before !== after) ? after : null;
    renderPage();
    loadNextQuestion(course);
  }

  function wireTutor(course) {
    var mode = view.tutorMode || "hub";
    var review = document.getElementById("reviewBtn");
    if (review) review.onclick = function () { view.tutorMode = "review"; renderPage(); };
    var back = document.getElementById("runBack");
    if (back) back.onclick = function () { view.tutorMode = "hub"; view.tutorTopic = null; tutorRun = null; renderPage(); };

    if (mode === "hub") {
      var ext = document.getElementById("extractBtn");
      if (ext) ext.onclick = async function () {
        if (course.materials.length === 0) { alert("Add some material first."); return; }
        var orig = ext.innerHTML; ext.disabled = true; ext.innerHTML = IC.spark + "Extracting…";
        try {
          var names = await extractTopics(course), have = {};
          course.topics.forEach(function (t) { have[t.name.toLowerCase()] = true; });
          names.forEach(function (n) {
            n = String(n).trim();
            if (n && !have[n.toLowerCase()]) { course.topics.push({ id: uid(), name: n, source: "ai" }); have[n.toLowerCase()] = true; }
          });
          persist(); renderPage();
        } catch (e) { alert("Topic extraction failed: " + e.message); ext.disabled = false; ext.innerHTML = orig; }
      };
      var addT = document.getElementById("addTopicBtn"), newT = document.getElementById("newTopic");
      var doAdd = function () {
        var n = newT.value.trim(); if (!n) { newT.focus(); return; }
        if (course.topics.some(function (t) { return t.name.toLowerCase() === n.toLowerCase(); })) { newT.value = ""; return; }
        course.topics.push({ id: uid(), name: n, source: "leader" }); persist(); renderPage();
      };
      if (addT) addT.onclick = doAdd;
      if (newT) newT.onkeydown = function (e) { if (e.key === "Enter") doAdd(); };
      Array.prototype.forEach.call(pageEl.querySelectorAll("[data-practice]"), function (b) {
        b.onclick = function () { startPractice(course, b.getAttribute("data-practice")); };
      });
      return;
    }

    if (mode === "run") {
      if (!tutorRun) { startPractice(course, view.tutorTopic); return; }
      if (tutorRun.phase === "loading" && !tutorRun.loading) { tutorRun.loading = true; loadNextQuestion(course); return; }
      if (tutorRun.phase === "question") {
        var box = document.getElementById("answerBox"), submit = document.getElementById("submitAns");
        if (submit) submit.onclick = function () {
          var v = box.value.trim(); if (!v) { box.focus(); return; }
          tutorRun.response = v; submitAnswer(course);
        };
        if (box) box.focus();
      } else if (tutorRun.phase === "graded") {
        Array.prototype.forEach.call(pageEl.querySelectorAll("[data-grade]"), function (b) {
          b.onclick = function () { tutorRun.chosen = b.getAttribute("data-grade"); renderPage(); };
        });
        var conf = document.getElementById("confirmGrade");
        if (conf) conf.onclick = function () { confirmGrade(course); };
      }
    }
  }

  // ---------- page wiring ----------
  function delCourse(id) {
    if (!confirm("Delete this course and all its data?")) return;
    state.courses = state.courses.filter(function (c) { return c.id !== id; });
    if (view.courseId === id) { view.courseId = null; view.page = "courses"; }
    persist(); render();
  }

  function wirePage() {
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-nav-btn]"), function (b) {
      b.onclick = function () { navigate({ page: b.getAttribute("data-nav-btn"), activeSession: null }); };
    });

    if (view.page === "courses") {
      Array.prototype.forEach.call(pageEl.querySelectorAll(".ccard[data-open]"), function (card) {
        card.onclick = function (e) {
          if (e.target.closest("[data-del]")) return;
          navigate({ page: "course", courseId: card.getAttribute("data-open"), tab: "materials", activeSession: null });
        };
      });
      Array.prototype.forEach.call(pageEl.querySelectorAll(".ccard [data-del]"), function (d) {
        d.onclick = function (e) { e.stopPropagation(); delCourse(d.getAttribute("data-del")); };
      });
      return;
    }

    if (view.page === "new") {
      var swRow = document.getElementById("swatchRow");
      swRow.onclick = function (e) {
        var b = e.target.closest(".sw"); if (!b) return;
        newColor = b.getAttribute("data-color");
        Array.prototype.forEach.call(swRow.querySelectorAll(".sw"), function (x) { x.classList.toggle("on", x === b); });
      };
      var name = document.getElementById("ncName");
      var create = function () {
        var n = name.value.trim(); if (!n) { name.focus(); return; }
        var c = normalizeCourse({ id: uid(), name: n, color: newColor });
        state.courses.push(c); persist();
        navigate({ page: "course", courseId: c.id, tab: "materials", activeSession: null });
      };
      document.getElementById("createBtn").onclick = create;
      name.onkeydown = function (e) { if (e.key === "Enter") create(); };
      name.focus();
      return;
    }

    // ----- course detail -----
    var course = currentCourse(); if (!course) return;
    Array.prototype.forEach.call(pageEl.querySelectorAll(".tab"), function (b) {
      b.onclick = function () {
        view.tab = b.getAttribute("data-tab"); view.activeSession = null;
        view.tutorMode = "hub"; view.tutorTopic = null; tutorRun = null;
        renderPage();
      };
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-goto]"), function (b) {
      b.onclick = function () { view.tab = b.getAttribute("data-goto"); view.activeSession = null; renderPage(); };
    });

    if (view.tab === "materials") {
      var addMat = document.getElementById("addMatBtn");
      var fileInput = document.getElementById("matFile");
      fileInput.onchange = function () {
        var f = fileInput.files[0]; if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          document.getElementById("matText").value = reader.result;
          if (!document.getElementById("matName").value) document.getElementById("matName").value = f.name;
        };
        reader.readAsText(f);
      };
      addMat.onclick = function () {
        var text = document.getElementById("matText").value.trim();
        var nm = document.getElementById("matName").value.trim() || ("material-" + (course.materials.length + 1) + ".txt");
        if (!text) { alert("Add some material text first."); return; }
        course.materials.push({ id: uid(), filename: nm, text: text, createdAt: Date.now() });
        persist(); renderPage();
      };
      Array.prototype.forEach.call(pageEl.querySelectorAll("[data-delmat]"), function (x) {
        x.onclick = function () {
          var id = x.getAttribute("data-delmat");
          course.materials = course.materials.filter(function (m) { return m.id !== id; });
          persist(); renderPage();
        };
      });
    }

    if (view.tab === "chat") {
      var input = document.getElementById("chatInput");
      var send = document.getElementById("sendBtn");
      var scroll = pageEl.querySelector(".content");
      var toBottom = function () { var s = pageEl.querySelector(".content"); if (s) s.scrollTop = s.scrollHeight; };
      var doSend = async function () {
        var text = input.value.trim(); if (!text) return;
        course.chat.push({ role: "user", content: text }); persist(); renderPage();
        var logEl = document.getElementById("chatLog");
        var t = document.createElement("div");
        t.className = "thinking";
        t.innerHTML = 'Thinking<span class="dots"><span></span><span></span><span></span></span>';
        logEl.appendChild(t); toBottom();
        try {
          var ans = await answerQuestion(course, text);
          course.chat.push({ role: "assistant", content: ans.content, citations: ans.citations });
        } catch (e) {
          course.chat.push({ role: "assistant", content: "⚠️ Couldn't reach Claude — " + e.message, citations: [] });
        }
        persist(); renderPage(); toBottom();
      };
      send.onclick = doSend;
      input.onkeydown = function (e) { if (e.key === "Enter") doSend(); };
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }

    if (view.tab === "sessions") {
      var gen = document.getElementById("genBtn");
      var topic = document.getElementById("topicInput");
      gen.onclick = async function () {
        var t = topic.value.trim();
        if (!t) { alert("Enter a topic."); return; }
        if (course.materials.length === 0) { alert("Upload some material for this course first."); return; }
        var orig = gen.innerHTML;
        gen.disabled = true; gen.innerHTML = IC.spark + 'Generating…';
        try {
          var s = await generateSession(course, t);
          course.sessions.push(s); view.activeSession = s.id; persist(); renderPage();
        } catch (e) {
          alert("Session generation failed: " + e.message);
          gen.disabled = false; gen.innerHTML = orig;
        }
      };
      if (topic) topic.onkeydown = function (e) { if (e.key === "Enter") gen.click(); };
      var sel = document.getElementById("sessionSelect");
      if (sel) { if (view.activeSession) sel.value = view.activeSession; sel.onchange = function () { view.activeSession = sel.value; renderPage(); }; }
    }

    if (view.tab === "tutor") wireTutor(course);
  }

  // ---------- side nav events ----------
  document.getElementById("primaryNav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-nav]"); if (!b) return;
    navigate({ page: b.getAttribute("data-nav"), activeSession: null });
  });
  courseList.addEventListener("click", function (e) {
    var del = e.target.closest("[data-del]");
    if (del) { e.stopPropagation(); delCourse(del.getAttribute("data-del")); return; }
    var item = e.target.closest(".course");
    if (item) navigate({ page: "course", courseId: item.getAttribute("data-id"), tab: "materials", activeSession: null });
  });

  document.getElementById("resetBtn").onclick = function () {
    if (!confirm("Clear all demo data from this browser and reload the sample course?")) return;
    localStorage.removeItem(KEY); state = seed();
    view.courseId = null; view.page = "courses"; view.tab = "materials"; view.activeSession = null;
    persist(); render();
  };

  // ---------- initial paint ----------
  render();
})();
</script>
</body>
</html>
