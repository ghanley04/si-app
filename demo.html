<!doctype html>
<!--
  ============================================================
  PRE-FLIGHT CHECKLIST  (read this before editing the file)
  ============================================================
  1. CLOSE ALL COMMENTS. Every comment must be terminated, or it
     silently swallows the rest of the file. Delimiters:
       - HTML:  open with  angle-bang-dash-dash , close with  dash-dash-angle
       - CSS:   open with  slash-star , close with  star-slash
       - JS:    double-slash to end of line, or slash-star ... star-slash
     (Do NOT write a literal HTML comment-close sequence inside a
      comment: it ends the comment early and dumps the rest of the
      file onto the page. That is why this list spells the delimiters
      out in words instead of symbols.)
  2. THIS IS A SINGLE HTML FILE. All HTML, CSS, and JavaScript live
     in demo.html and nowhere else. Edit ONLY this one file — no
     extra stylesheets, scripts, build steps, or config files.
  3. BRANDING: the app is named "SIsta" (SI + sister). Keep it on
     every iteration — never rename it back to "SI Companion" or
     anything else. The wordmark must read "SIsta" in ALL of these:
       - the browser tab: the HTML title element (angle-title...);
       - the side-rail logo: the .brand .name div;
       - the sign-in screen: the .auth-brand .name div AND the
         "Choose how you're using SIsta" sub-line;
       - the console build stamp and the sign-out confirm text.
     The logo mark is the accent-colored star/spark tile (IC.spark)
     next to the wordmark; keep the mark + "SIsta" together.
  4. STRUCTURED-JSON CALLS NEED A MAXTOKENS HEADROOM. Any callClaude
     that passes a `schema` and then JSON.parse()s the result will
     throw "Unterminated string in JSON at position N" if the model's
     output hits max_tokens and truncates mid-string. The default cap
     (CLAUDE.maxTokens = 2048) is only safe for tiny outputs. Whenever
     a call can return a long or multi-item JSON object, pass an
     explicit high maxTokens. Known cases (keep them high):
       - extractContacts()  — 8192 (big rosters of sections/TAs/leaders)
       - generateSession()  — 8192 (warm-ups + group problems +
         wrap-up checks, each with a full model answer)
     If you add another schema'd call, size its maxTokens to the
     worst-case output, not the typical one.
  5. CONTACTS EXTRACTION must keep working end to end. Guard these:
     - Because this is one cached HTML file, the dev server MUST send
       no-cache headers (see .claude/launch.json Cache-Control) or the
       browser runs stale code and "Refresh from syllabus" looks broken.
       Hard-reload (Cmd+Shift+R) after editing.
     - Each contact carries firstName + lastName (not just name),
       plus role, section (role detail: section taught / who a TA
       covers / SI session times), email, office, hours, semesters.
       If you add a field, thread it through the extract schema+prompt,
       normalizeContact, backfillContact, mergeContacts, the edit form,
       and the card render — or it silently drops on save/refresh.
     - "Refresh from syllabus" is authoritative for syllabus-pulled
       contacts but must never clobber a hand-added (source "leader")
       or hand-edited (edited flag) contact.
     - A person's NAME is never a location/modality: isJunkName() keeps
       values like "Webex Online" out of the name fields.
  ------------------------------------------------------------
  CLAUDE API KEY: this file holds NO key. It is read at runtime from
  the project's git-ignored .env file (CLAUDE_API_KEY=…), which the dev
  server serves from the project root; the key is never written into
  this file, so it can never be committed or pushed to GitHub.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIsta</title>
<style>
  /* ===================== THEME TOKENS ===================== */
  :root {
    /* Warm studio (light) */
    --rail-bg:#4B1528; --rail-fg:#E7B9C8; --rail-fg-strong:#FFFFFF; --rail-muted:#B57E93;
    --rail-hover:#5E1B33; --rail-active-soft:#72243E; --rail-border:#5E1B33;
    --accent:#D85A30; --accent-fg:#FFFFFF; --accent-solid-fg:#C24A24;
    --accent-soft-bg:#FBEDE7; --accent-soft-fg:#99381B; --accent-ring:rgba(216,90,48,.16);
    --app-bg:#FCF7F3; --panel-bg:#FFFFFF; --surface-2:#FBF3EC;
    --border:#EEE1D9; --border-strong:#E1CFC4;
    --text:#2B2320; --text-muted:#93796C; --hover-soft:#FBEDE7; --field-bg:#FFFFFF;
    --user-bg:#4B1528; --user-fg:#FFFFFF;
    --ready-bg:#E6F5EC; --ready-fg:#2C7A4B; --danger:#DC2626;
    --info-bg:#FBF3EC; --info-fg:#93796C; --scroll:#E7D9CF;
    --warn-bg:#FBF0DD; --warn-fg:#8A5A12; --bad-bg:#FBE7E4; --bad-fg:#B23A22; --bar-track:#EEE1D9;
    --radius:10px;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  html[data-theme="dark"] {
    /* Focused dark */
    --rail-bg:#171310; --rail-fg:#B7ADA4; --rail-fg-strong:#FAF6F2; --rail-muted:#7C6E63;
    --rail-hover:#221C17; --rail-active-soft:#2A231C; --rail-border:#2A231C;
    --accent:#E0714F; --accent-fg:#1B1613; --accent-solid-fg:#EF9066;
    --accent-soft-bg:#2E2119; --accent-soft-fg:#F0997B; --accent-ring:rgba(224,113,79,.24);
    --app-bg:#1E1915; --panel-bg:#26201B; --surface-2:#221C17;
    --border:#322A22; --border-strong:#3E342A;
    --text:#F1EAE3; --text-muted:#A29387; --hover-soft:#2A231C; --field-bg:#221C17;
    --user-bg:#E0714F; --user-fg:#1B1613;
    --ready-bg:#1F3A2A; --ready-fg:#6FCE97; --danger:#F0776F;
    --info-bg:#221C17; --info-fg:#A29387; --scroll:#3A3129;
    --warn-bg:#33270F; --warn-fg:#E7B25A; --bad-bg:#3A211B; --bad-fg:#F0997B; --bar-track:#322A22;
  }

  * { box-sizing:border-box; transition:background-color .18s ease, border-color .18s ease, color .18s ease; }
  html,body { height:100%; }
  body { margin:0; font-family:var(--font); background:var(--app-bg); color:var(--text);
    line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:99px; border:3px solid transparent; background-clip:content-box; }

  .i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.75;
       stroke-linecap:round; stroke-linejoin:round; display:inline-block; vertical-align:middle; flex-shrink:0; }
  .i-fill { fill:currentColor; stroke:none; }

  /* ===================== APP SHELL ===================== */
  .app { display:grid; grid-template-columns:244px 1fr; height:100vh; }

  /* ---------- SIDE NAV ---------- */
  .rail { background:var(--rail-bg); border-right:1px solid var(--rail-border);
          display:flex; flex-direction:column; height:100vh; }
  .brand { display:flex; align-items:center; gap:11px; padding:20px 18px 14px; }
  .brand .mark { width:32px; height:32px; border-radius:9px; background:var(--accent);
    color:var(--accent-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark .i { width:19px; height:19px; }
  .brand .name { font-size:15.5px; font-weight:650; color:var(--rail-fg-strong); letter-spacing:-.01em; }

  .rail-scroll { flex:1; min-height:0; overflow-y:auto; padding:6px 12px 12px; }
  .nav-group { display:flex; flex-direction:column; gap:2px; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
    color:var(--rail-fg); font-size:13.5px; font-weight:500; cursor:pointer; border:0;
    background:transparent; width:100%; text-align:left; font-family:inherit; }
  .nav-item .i { width:18px; height:18px; opacity:.92; }
  .nav-item:hover { background:var(--rail-hover); color:var(--rail-fg-strong); }
  .nav-item.on { background:var(--rail-active-soft); color:var(--rail-fg-strong); }

  .nav-label { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--rail-muted);
    font-weight:600; padding:18px 11px 8px; }
  .nav-label.rail-subhead { padding-top:20px; margin-top:6px; border-top:1px solid var(--rail-hover); }

  .course { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    color:var(--rail-fg); font-size:13.5px; font-weight:500; cursor:pointer; }
  .course:hover { background:var(--rail-hover); }
  .course.on { background:var(--rail-active-soft); color:var(--rail-fg-strong);
    border:1px solid var(--rail-border); padding:7px 9px; }
  .course .swatch { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .course.on .swatch { box-shadow:0 0 0 3px rgba(255,255,255,.12); }
  .course .course-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .course .course-del { border:0; background:transparent; color:var(--rail-muted); cursor:pointer;
    padding:2px; border-radius:6px; opacity:0; display:flex; }
  .course .course-del .i { width:14px; height:14px; }
  .course:hover .course-del { opacity:.7; }
  .course .course-del:hover { opacity:1; color:#F0997B; background:var(--rail-hover); }
  .rail-empty { font-size:13px; color:var(--rail-muted); font-style:italic; padding:6px 11px; }

  .rail-foot { border-top:1px solid var(--rail-border); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .user { display:flex; align-items:center; gap:10px; padding:2px 4px; }
  .user .av { width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--accent-fg);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:650; flex-shrink:0; }
  .user .who { font-size:13px; color:var(--rail-fg-strong); font-weight:500; line-height:1.25; }
  .user .who small { display:block; font-size:11px; color:var(--rail-muted); font-weight:400; }
  .foot-row { display:flex; gap:8px; }
  .foot-btn { flex:1; border:1px solid var(--rail-border); background:transparent; color:var(--rail-fg);
    font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer; border-radius:9px;
    padding:8px 10px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .foot-btn:hover { background:var(--rail-hover); color:var(--rail-fg-strong); }
  .foot-btn .i { width:16px; height:16px; }

  /* ---------- MAIN ---------- */
  .main { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--app-bg); }
  .infobar { display:flex; align-items:center; gap:11px; padding:11px 32px; font-size:12.5px;
    color:var(--info-fg); background:var(--info-bg); border-bottom:1px solid var(--border); }
  .infobar .i { color:var(--accent-solid-fg); width:17px; height:17px; }
  .infobar span { flex:1; }
  .infobar strong { color:var(--text); font-weight:600; }
  .infobar .close { border:0; background:transparent; color:var(--info-fg); cursor:pointer; padding:3px; border-radius:6px; display:flex; }
  .infobar .close:hover { background:var(--hover-soft); color:var(--text); }

  #page { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .page-scroll { flex:1; min-height:0; overflow-y:auto; padding:34px 32px 36px; }
  .page-inner { max-width:980px; margin:0 auto; }

  .page-head { display:flex; align-items:flex-start; gap:16px; margin-bottom:26px; }
  .page-title { font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0; color:var(--text); }
  .page-sub { font-size:14px; color:var(--text-muted); margin:7px 0 0; max-width:580px; line-height:1.6; }
  .page-head .btn { margin-left:auto; }

  /* ---------- COURSES GRID ---------- */
  .course-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:16px; }
  .ccard { position:relative; text-align:left; cursor:pointer; background:var(--panel-bg);
    border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column;
    min-height:138px; font-family:inherit; }
  .ccard:hover { border-color:var(--border-strong); box-shadow:0 8px 20px -12px rgba(43,35,32,.3); transform:translateY(-1px); }
  .ccard-top { display:flex; align-items:center; margin-bottom:12px; }
  .ccard-dot { width:11px; height:11px; border-radius:50%; }
  .ccard-del { margin-left:auto; border:0; background:transparent; color:var(--text-muted); cursor:pointer;
    padding:4px; border-radius:7px; opacity:0; display:flex; }
  .ccard:hover .ccard-del { opacity:.6; }
  .ccard-del:hover { opacity:1; color:var(--danger); background:var(--hover-soft); }
  .ccard-del .i { width:16px; height:16px; }
  .ccard-name { font-size:16px; font-weight:650; color:var(--text); }
  .ccard-meta { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .ccard-foot { margin-top:auto; padding-top:14px; font-size:12.5px; font-weight:600;
    color:var(--accent-solid-fg); display:flex; align-items:center; gap:6px; }
  .ccard-foot .i { width:15px; height:15px; }
  .add-ccard { align-items:center; justify-content:center; text-align:center; border:1.5px dashed var(--border-strong);
    background:transparent; color:var(--text-muted); gap:8px; }
  .add-ccard:hover { color:var(--accent-solid-fg); border-color:var(--accent); box-shadow:none; transform:none; }
  .add-ccard .i { width:22px; height:22px; }
  .add-ccard .t { font-size:13.5px; font-weight:600; }

  /* ---------- NEW COURSE FORM ---------- */
  .form-wrap { max-width:520px; margin:0 auto; }
  .back { border:0; background:transparent; color:var(--text-muted); font-family:inherit; font-size:13px;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:6px 2px; }
  .back:hover { color:var(--text); }
  .back .i { width:16px; height:16px; }
  .form-card { background:var(--panel-bg); border:1px solid var(--border); border-radius:16px; padding:28px; margin-top:14px; }
  .form-card .page-title { font-size:21px; }
  .swatch-row { display:flex; gap:10px; margin-top:2px; }
  .sw { width:32px; height:32px; border-radius:9px; cursor:pointer; border:0; padding:0; outline:2px solid transparent; outline-offset:2px; }
  .sw.on { outline-color:var(--text); }
  .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:26px; }

  /* ---------- COURSE DETAIL ---------- */
  .crumb { display:flex; align-items:center; gap:9px; padding:18px 32px 0; font-size:13px; color:var(--text-muted); }
  .crumb .back { padding:2px; }
  .crumb .sep { opacity:.5; }
  .crumb .cur { color:var(--text); font-weight:600; }
  .ctx { display:flex; align-items:flex-start; gap:16px; padding:14px 32px 0; }
  .ctx-title { font-size:22px; font-weight:650; letter-spacing:-.015em; margin:0; color:var(--text); }
  .ctx-meta { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin-top:5px; }
  .ctx-meta .sep { opacity:.5; }
  .ctx-meta .live { display:inline-flex; align-items:center; gap:6px; color:var(--accent-solid-fg); }
  .ctx-meta .live .pulse { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .ctx-actions { margin-left:auto; display:flex; gap:9px; }

  .btn { font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:9px;
    padding:9px 15px; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn .i { width:16px; height:16px; }
  .btn.primary { background:var(--accent); color:var(--accent-fg); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { background:transparent; color:var(--text-muted); border-color:var(--border-strong); }
  .btn.ghost:hover { background:var(--hover-soft); color:var(--text); }

  .tabs { display:flex; padding:16px 32px 0; border-bottom:1px solid var(--border); }
  .tab { font-family:inherit; border:0; background:transparent; cursor:pointer; font-size:13.5px;
    font-weight:600; color:var(--text-muted); padding:10px 2px; margin-right:24px; position:relative; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent-solid-fg); }
  .tab.active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:var(--accent); border-radius:2px; }

  .content { flex:1; min-height:0; overflow-y:auto; padding:26px 32px 30px; }
  .content-inner { max-width:820px; }

  input[type=text], textarea, select {
    width:100%; font-family:inherit; font-size:14px; color:var(--text); background:var(--field-bg);
    border:1px solid var(--border-strong); border-radius:var(--radius); padding:10px 12px; outline:none; }
  input[type=text]::placeholder, textarea::placeholder { color:var(--text-muted); }
  input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
  textarea { resize:vertical; min-height:130px; line-height:1.55; }
  .field-label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }

  .sec-lead { font-size:13.5px; color:var(--text-muted); margin:0 0 20px; max-width:600px; line-height:1.6; }
  .empty { text-align:center; padding:56px 20px; color:var(--text-muted); }
  .empty .i { width:34px; height:34px; color:var(--text-muted); margin-bottom:12px; opacity:.7; }
  .empty .big { font-size:15px; font-weight:600; color:var(--text); }
  .empty .sm { font-size:13px; margin:4px 0 18px; }

  /* materials */
  .mat { display:flex; align-items:center; gap:14px; padding:13px 16px; background:var(--panel-bg);
    border:1px solid var(--border); border-radius:12px; margin-bottom:10px; }
  .mat .fic { width:38px; height:38px; border-radius:9px; background:var(--accent-soft-bg);
    color:var(--accent-soft-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mat .minfo { min-width:0; flex:1; }
  .mat .fname { font-size:14px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mat .fmeta { font-size:12px; color:var(--text-muted); margin-top:1px; }
  .mat .ready { font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--ready-bg); color:var(--ready-fg); display:inline-flex; align-items:center; gap:5px; flex-shrink:0; }
  .mat .ready .d { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .mat .ready.private { background:var(--surface-2); color:var(--text-muted); }
  .mat-group-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); margin:22px 2px 10px; }
  .mat-group-label:first-child { margin-top:4px; }
  .mat-group-label .i { width:15px; height:15px; }
  .mat .rm { border:0; background:transparent; color:var(--text-muted); cursor:pointer; padding:5px; border-radius:7px; display:flex; }
  .mat .rm:hover { color:var(--danger); background:var(--hover-soft); }
  .mat .rm .i { width:16px; height:16px; }
  .add-card { margin-top:20px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:20px; }
  .add-card h3 { margin:0 0 4px; font-size:14.5px; font-weight:650; color:var(--text); }
  .add-card .hint { font-size:12.5px; color:var(--text-muted); margin:0 0 16px; }
  .add-grid { display:grid; gap:14px; }
  .file-drop { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px dashed var(--border-strong);
    border-radius:11px; color:var(--text-muted); font-size:13px; }
  .file-drop .i { color:var(--accent-solid-fg); }
  .file-drop input[type=file] { font-family:inherit; font-size:12.5px; color:var(--text-muted); }
  .file-status { margin-left:auto; font-size:12px; color:var(--accent-solid-fg); font-weight:600; }
  .add-actions { display:flex; justify-content:flex-end; }

  /* chat */
  .chat-pane { display:flex; flex-direction:column; min-height:100%; }
  .thread { flex:1; display:flex; flex-direction:column; gap:16px; padding-bottom:16px; }
  .bubble { max-width:80%; font-size:14px; line-height:1.6; padding:12px 15px; }
  .bubble.user { align-self:flex-end; background:var(--user-bg); color:var(--user-fg); border-radius:15px 15px 4px 15px; }
  .bubble.assistant { align-self:flex-start; background:var(--panel-bg); color:var(--text);
    border:1px solid var(--border); border-radius:15px 15px 15px 4px; white-space:pre-wrap; }
  .sources { margin-top:11px; display:flex; gap:7px; flex-wrap:wrap; }
  .chip { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--accent-soft-bg); color:var(--accent-soft-fg); display:inline-flex; align-items:center; gap:5px; }
  .chip .i { width:12px; height:12px; }
  .thinking { align-self:flex-start; font-size:13px; color:var(--text-muted); padding:4px 2px; display:flex; align-items:center; gap:8px; }
  .thinking .dots { display:inline-flex; gap:3px; }
  .thinking .dots span { width:5px; height:5px; border-radius:50%; background:var(--text-muted); animation:bounce 1s infinite; }
  .thinking .dots span:nth-child(2){ animation-delay:.15s; }
  .thinking .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100%{ opacity:.3; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-3px);} }
  .composer-wrap { position:sticky; bottom:0; background:var(--app-bg); padding-top:12px; margin-top:auto; }
  .composer { display:flex; gap:10px; align-items:center; padding:7px 7px 7px 16px;
    border:1px solid var(--border-strong); border-radius:13px; background:var(--panel-bg); }
  .composer input { border:0; background:transparent; padding:8px 0; flex:1; }
  .composer input:focus { box-shadow:none; }
  .composer .send { width:38px; height:38px; border:0; border-radius:9px; background:var(--accent);
    color:var(--accent-fg); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

        <button class="close" id="infobarClose" aria-label="Dismiss"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<script>
(function () {
  "use strict";

  // Build stamp — bump when shipping changes. If the console doesn't show this
  // exact line on load, the browser is running an OLD cached/other copy.
  var BUILD = "2026-07-14 SIsta (leader/student roles, classrooms, rebrand)";
  console.log("%c[SIsta] build " + BUILD, "color:#D85A30;font-weight:bold");

  // ============================================================
  // CLAUDE CONFIG  —  the API key is NEVER stored in this file.
  // ============================================================
  // The key is read at runtime from the project's .env file (CLAUDE_API_KEY=…),
  // which the dev server serves from the project root and .gitignore keeps out
  // of git. loadEnvKey() fetches it on startup into ENV_KEY; nothing is
  // hardcoded here, so no key can ever be committed or pushed to GitHub.
  var ENV_KEY = "";
  function getKey() { return ENV_KEY.trim(); }
  async function loadEnvKey() {
    try {
      var res = await fetch(".env", { cache: "no-store" });
      if (!res.ok) return;
      var m = (await res.text()).match(/^\s*CLAUDE_API_KEY\s*=\s*(.+?)\s*$/m);
      if (m) ENV_KEY = m[1].replace(/^["']|["']$/g, "");
    } catch (e) { /* no .env reachable — falls back to offline mode */ }
  }

  var CLAUDE = {
    model: "claude-opus-4-8",
    maxTokens: 2048
  };

  function claudeReady() { return getKey().length > 0; }

  // Calls the Claude Messages API directly from the browser.
  // opts: { system, user, content, schema, maxTokens }
  //   user    — a plain string prompt, OR
  //   content — an array of content blocks (text, document, image, …)
  //   schema  — structured JSON output; maxTokens — override the default cap.
  async function callClaude(opts) {
    var body = {
      model: CLAUDE.model,
      max_tokens: opts.maxTokens || CLAUDE.maxTokens,
      messages: [{ role: "user", content: opts.content || opts.user }]
    };
    if (opts.system) body.system = opts.system;
    if (opts.schema) body.output_config = { format: { type: "json_schema", schema: opts.schema } };
    if (opts.tools) body.tools = opts.tools;

    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("Claude API " + res.status + ": " + (await res.text()));
    var data = await res.json();
    return (data.content || [])
      .filter(function (b) { return b.type === "text"; })
      .map(function (b) { return b.text; })
      .join("");
  }

  // Reads a File as a base64 data URL.
  function readAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error("Couldn't read the file.")); };
      r.readAsDataURL(file);
    });
  }

  // Loads the pdf.js library once, on demand, from a CDN. This lets the app
  // read PDFs entirely in the browser — no API key required.
  var PDFJS_VER = "3.11.174";
  var pdfjsLoading = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfjsLoading) return pdfjsLoading;
    pdfjsLoading = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VER + "/pdf.min.js";
      s.onload = function () {
        if (!window.pdfjsLib) { reject(new Error("PDF reader failed to load.")); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VER + "/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      };
      s.onerror = function () { reject(new Error("Couldn't load the PDF reader (offline?).")); };
      document.head.appendChild(s);
    });
    return pdfjsLoading;
  }

  // Extracts text from a PDF in the browser with pdf.js. Works for any
  // text-based PDF (syllabi, slides, problem sets) with no API key.
  async function extractPdfTextLocal(file) {
    var pdfjsLib = await loadPdfJs();
    var buf = await file.arrayBuffer();

  async function suggestSessionTopics(course) {

  function localSuggestSessionTopics(course) {
    var known = course.topics.map(function (t) { return t.name; });

  function localGenerateSession(course, topic) {
    var ranked = rank(allChunks(course), topic, 6);
    var facts = ranked.map(function (r) { return r.chunk.text; });
    if (facts.length === 0) facts = allChunks(course).slice(0, 6).map(function (c) { return c.text; });
    var hasFacts = facts.length > 0;
    function pick(n) { return facts[n % Math.max(facts.length, 1)] || ""; }
    var t = topic.trim();
    // Offline (no API key): questions plus self-check guidance. When materials
    // exist, answers cite the closest material; otherwise they describe what a
    // correct response should contain so you can still grade yourself.
    var warmUp = [
      { q: "In one sentence, define or describe " + t + " in your own words.",
        answer: hasFacts ? shorten(pick(0)) : "A strong answer states the core idea of " + t + " in one clear sentence — check it against your notes or textbook definition." },
      { q: hasFacts ? "Recall from the material: " + shorten(pick(0)) : "List two key terms you associate with " + t + " and what each means.",
        answer: hasFacts ? shorten(pick(0)) : "Name two terms central to " + t + " and give a short, accurate meaning for each." },
      { q: "What is one key term related to " + t + ", and what does it mean?",
        answer: hasFacts ? shorten(pick(1)) : "Pick a key term tied to " + t + " and state its accepted definition in your own words." }
    ];
    var groupProblems = [
      { prompt: "Work through this together: apply " + t + " to a concrete example." + (hasFacts ? " Reference: " + shorten(pick(1)) : ""),
        hint: "Start by identifying what's being asked, then map it to the core definition of " + t + ".",
        answer: hasFacts ? shorten(pick(1)) : "A full answer sets up the example, applies " + t + " step by step, and states the result with correct reasoning." },
      { prompt: "Compare two situations involving " + t + " and explain why they differ." + (hasFacts ? " Reference: " + shorten(pick(2)) : ""),
        hint: "Focus on which variable changes between the two cases.",
        answer: hasFacts ? shorten(pick(2)) : "Identify the variable that changes between the two cases and explain how it drives the different outcomes." }
    ];
    var wrapUpCheck = [
      { q: "Can each person state the main idea of " + t + " without looking at notes?",
        answer: "Everyone should be able to give the one-sentence definition of " + t + " from memory." },
      { q: "What was the trickiest part of today's problems, and how did the group resolve it?",
        answer: "Name the specific sticking point and the step or idea that unblocked it." },
      { q: "Name one thing you'll review before the next class about " + t + ".",
        answer: "Pick the weakest sub-topic within " + t + " and commit to reviewing it." }
    ];
    return { id: uid(), topic: t, createdAt: Date.now(), grades: {},
      content: { warmUp: warmUp, groupProblems: groupProblems, wrapUpCheck: wrapUpCheck } };
  }
  function shorten(s) { s = s.replace(/\s+/g, " ").trim(); return s.length > 140 ? s.slice(0, 137) + "…" : s; }

  // The three facilitation strategies — woven into checks-for-understanding and

  function siToolkitPrompt() {

  // ============================================================
  // TUTOR MODE  (adaptive practice — see docs/tutor-mode-design.md)

  // Gate constants from the design doc. Demo-tuned lower than the

  // cleared in a few questions while you click around.
  var TUTOR = { OK_WEIGHT: 0.5, WINDOW: 8, MIN_ATTEMPTS: 4, PASS: 0.80 };
  var LEVELS = ["easy", "medium", "hard"];

  function confirmedAttempts(course, topic, level) {
    return course.attempts
      .filter(function (a) { return a.topic === topic && a.confirmed && (level == null || a.difficulty === level); })
      .sort(function (a, b) { return a.createdAt - b.createdAt; });
  }

  // Rolling mastery over the last WINDOW confirmed attempts at a level.

    if (win.length === 0) return { pct: 0, count: 0, ready: false };
    var pts = win.reduce(function (s, a) { return s + gradePoints(a.finalGrade); }, 0);
    var pct = pts / win.length;
    return { pct: pct, count: win.length, ready: win.length >= TUTOR.MIN_ATTEMPTS && pct >= TUTOR.PASS };
  }

    return false;

    else if (level === "hard" && m.ready) status = "mastered";
    else if (m.count >= TUTOR.WINDOW && m.pct < TUTOR.PASS) status = "stuck";
    else if (m.pct >= TUTOR.PASS) status = "ontrack";

    if (!claudeReady()) return localGenerateQuestions(course, topic, level, count);
    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var schema = { type: "object", properties: { questions: { type: "array", items: {
      type: "object",
      properties: { stem: { type: "string" }, answer: { type: "string" }, solution: { type: "string" } },
      required: ["stem", "answer", "solution"], additionalProperties: false } } },
      required: ["questions"], additionalProperties: false };
    var system = "You are an adaptive tutor. Write free-response practice questions grounded ONLY in the provided course materials. Difficulty: easy = direct recall or a one-step application of a single idea; medium = combine 2-3 ideas or a multi-step calculation; hard = multi-step reasoning, synthesis across ideas, or transfer to a new situation. For each question give: stem (the question a student answers in words), answer (the concise correct final answer), and solution (a short worked explanation that serves as the answer key). Do not reference figures or images.";
    var user = "COURSE MATERIALS:\n" + context + "\n\nTOPIC: " + topic + "\nDIFFICULTY: " + level +
      "\n\nWrite " + count + " distinct " + level + " questions on this topic, grounded in the materials.";
    var parsed = JSON.parse(await callClaude({ system: system, user: user, schema: schema }));
    return parsed.questions || [];
  }

  async function gradeAnswer(stem, answerKey, response) {
    if (!claudeReady()) return localGrade(answerKey, response);
    var schema = { type: "object", properties: {
      grade: { type: "string", enum: ["correct", "ok", "wrong"] },
      feedback: { type: "string" } }, required: ["grade", "feedback"], additionalProperties: false };
    var system = "You grade a student's free-response answer against an answer key. Choose exactly one grade: 'correct' = the answer is right; 'ok' = the method or setup is right but there's a minor slip such as an arithmetic error or small omission; 'wrong' = incorrect or missing the key idea. Give one or two sentences of specific, encouraging feedback. The student can override your grade, so be fair.";
    var user = "QUESTION:\n" + stem + "\n\nANSWER KEY:\n" + answerKey + "\n\nSTUDENT ANSWER:\n" + response + "\n\nGrade it.";
    return JSON.parse(await callClaude({ system: system, user: user, schema: schema }));
  }

  async function extractTopics(course) {
    if (!claudeReady()) return localExtractTopics(course);
    var context = course.materials.map(function (m) { return "### " + m.filename + "\n" + m.text; }).join("\n\n");
    var schema = { type: "object", properties: { topics: { type: "array", items: { type: "string" } } },
      required: ["topics"], additionalProperties: false };
    var system = "Extract a concise list of study topics from the course materials. Return 4-8 short topic names (2-5 words each) covering the main ideas a student could practice. No numbering, no duplicates.";
    return JSON.parse(await callClaude({ system: system, user: "COURSE MATERIALS:\n" + context, schema: schema })).topics || [];
  }

  function localGenerateQuestions(course, topic, level, count) {
    var ranked = rank(allChunks(course), topic, count + 2);
    var facts = ranked.length ? ranked.map(function (r) { return r.chunk.text; })
      : allChunks(course).slice(0, count).map(function (c) { return c.text; });
    if (facts.length === 0) facts = ["the uploaded course material"];
    var out = [];
    for (var i = 0; i < count; i++) {
      var fact = facts[i % facts.length], stem;
      if (level === "easy") stem = "In your own words, define or state the key idea of \"" + topic + "\" from the notes.";
      else if (level === "medium") stem = "Apply " + topic + " to explain this situation: " + shorten(fact);
      else stem = "Analyze a scenario involving " + topic + " and justify your reasoning step by step, connecting it to: " + shorten(fact);
      out.push({ stem: stem, answer: shorten(fact), solution: fact });
    }
    return out;
  }

  function localGrade(answerKey, response) {
    var rt = tokenize(response);
    if (rt.length === 0) return { grade: "wrong", feedback: "No answer was entered." };
    var kt = new Set(tokenize(answerKey)), hit = 0;
    rt.forEach(function (t) { if (kt.has(t)) hit++; });
    var ratio = kt.size ? hit / kt.size : 0;
    var grade = ratio > 0.35 ? "correct" : ratio > 0.15 ? "ok" : "wrong";
    return { grade: grade, feedback: "Offline estimate (no API key): your answer overlapped about " +
      Math.round(ratio * 100) + "% with the key — confirm or override the grade yourself." };
  }

  function localExtractTopics(course) {
    var freq = {};
    allChunks(course).forEach(function (c) {
      tokenize(c.text).forEach(function (t) { if (t.length > 4) freq[t] = (freq[t] || 0) + 1; });
    });
    return Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 6)
      .map(function (t) { return t.charAt(0).toUpperCase() + t.slice(1); });
  }

    });

    var h = Math.round(m / 60); if (h < 24) return h + " hr" + (h === 1 ? "" : "s") + " ago";
    return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });

  // Generate a quick AI answer from the class materials and attach it to q.
  async function attachAiAnswer(cl, q, btn) {

      var ans = await answerQuestion(cl, q.text);
      q.aiAnswer = { content: ans.content, citations: ans.citations || [], createdAt: Date.now() };
      persist(); renderPage();

      });
      var input = document.getElementById("askInput");

      var newQ = function (status) {

          text: input.value.trim(), createdAt: Date.now(), aiAnswer: null, leaderAnswer: null, status: status };

        var orig = askAi.innerHTML; askAi.disabled = true; askLeader.disabled = true; askAi.innerHTML = IC.spark + 'Thinking…';

          q.aiAnswer = { content: ans.content, citations: ans.citations || [], createdAt: Date.now() };
        } catch (e) {
          q.aiAnswer = { content: "⚠️ Couldn't reach the AI — " + e.message + "\n\nTap “I still need help” to send this to your SI leader.", citations: [], createdAt: Date.now() };
        }
        persist(); renderPage();
      };
      if (askLeader) askLeader.onclick = doAskLeader;
      if (askAi) askAi.onclick = doAskAi;
      if (input) input.onkeydown = function (e) {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doAskLeader(); }
      };
    }
  }

  // Which session the Sessions tab lands on: the student's explicit pick, else the
  // leader's newest (that's the point of the tab), else their own newest.
  function classroomActiveSession(cl, en) {
    var all = cl.sessions.concat(en.sessions);
    if (view.activeSession) {
      var picked = all.find(function (s) { return s.id === view.activeSession; });
      if (picked) return picked;
    }
    return cl.sessions[cl.sessions.length - 1] || en.sessions[en.sessions.length - 1] || null;
  }
  // Read-only for students: only the SI leader publishes sessions here. Sessions a
  // student generated before that rule still render (and stay deletable) under
  // "Your sessions" so nothing they already made vanishes on them.
  function renderClassroomSessions(cl, en) {
    var own = en.sessions, all = cl.sessions.concat(own);
    if (!all.length) {
      return '<div class="content-inner"><div class="empty">' + IC.spark +
        '<div class="big">No sessions yet</div>' +
        '<div class="sm">Your SI leader hasn’t published a practice session for this classroom yet. They’ll show up here as soon as one does.</div>' +
        '</div></div>';
    }
    var opt = function (s) { return '<option value="' + s.id + '">' + esc(s.topic) + ' — ' + new Date(s.createdAt).toLocaleString() + '</option>'; };
    var groups = "";
    if (cl.sessions.length) groups += '<optgroup label="From your SI leader">' + cl.sessions.map(opt).join("") + '</optgroup>';
    if (own.length) groups += '<optgroup label="Your sessions">' + own.map(opt).join("") + '</optgroup>';
    var picker = '<div class="session-pick"><label class="field-label">Sessions</label><select id="sessionSelect">' + groups + '</select></div>';

    var active = classroomActiveSession(cl, en);
    var isOwn = active && own.some(function (s) { return s.id === active.id; });

    }
    return '<div class="content-inner">' +
      '<p class="sec-lead">Practice sessions your SI leader published for this classroom. Reveal answers and grade yourself — your progress is saved to your account.</p>' +
      picker + worksheet + '</div>';

  // ---------- shared classroom wiring ----------
  function wireRoomTabs() {
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-roomtab]"), function (b) {
      b.onclick = function () { view.classroomTab = b.getAttribute("data-roomtab"); view.clSession = null; renderPage(); };
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-roomgoto]"), function (b) {
      b.onclick = function () { view.classroomTab = b.getAttribute("data-roomgoto"); view.clSession = null; renderPage(); };
    });
  }
  // Wire a rendered worksheet (reveal answers, self-grade, generate answers).
  // grades is the object mutated in place; persist() saves the whole state.
  function wireWorksheet(course, activeS, grades) {
    var ws = document.getElementById("worksheet");
    if (!ws || !activeS) return;
    // Reveal is per-question: each .q carries its own "reveal" class so grading
    // or revealing one answer never exposes the others.
    function setQReveal(q, on) {
      if (!q) return;
      q.classList.toggle("reveal", on);
      var rb = q.querySelector(".q-reveal");
      if (rb) rb.textContent = on ? "Hide answer" : "Reveal answer";
    }
    var toggle = document.getElementById("answersToggle");
    function syncToggle() {
      if (!toggle) return;
      var qs = ws.querySelectorAll(".q");
      var allShown = qs.length && Array.prototype.every.call(qs, function (q) { return q.classList.contains("reveal"); });
      toggle.innerHTML = IC.file + (allShown ? "Hide all answers" : "Reveal all answers");
    }
    if (toggle) toggle.onclick = function () {
      var qs = ws.querySelectorAll(".q");
      var anyHidden = Array.prototype.some.call(qs, function (q) { return !q.classList.contains("reveal"); });
      Array.prototype.forEach.call(qs, function (q) { setQReveal(q, anyHidden); });
      syncToggle();
    };
    Array.prototype.forEach.call(ws.querySelectorAll(".q-reveal"), function (btn) {
      btn.onclick = function () {
        var q = btn.parentNode;
        setQReveal(q, !q.classList.contains("reveal"));
        syncToggle();
      };
    });
    var scoreText = document.getElementById("wsScoreText");
    var resetBtn = document.getElementById("wsReset");
    function refreshScore() {
      if (scoreText) scoreText.textContent = worksheetScoreText(activeS, grades);
      if (resetBtn) resetBtn.style.display = worksheetScore(activeS, grades).graded ? "" : "none";
    }
    Array.prototype.forEach.call(ws.querySelectorAll(".gbtn"), function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-grade"), val = btn.getAttribute("data-val");
        if (grades[key] === val) delete grades[key]; else grades[key] = val;
        var group = btn.parentNode;
        Array.prototype.forEach.call(group.querySelectorAll(".gbtn"), function (b) {
          b.classList.toggle("on", b.getAttribute("data-val") === grades[key]);
        });
        var q = btn.parentNode.parentNode;
        if (grades[key] && q && !q.classList.contains("reveal")) { setQReveal(q, true); syncToggle(); }
        refreshScore(); persist();
      };
    });
    if (resetBtn) resetBtn.onclick = function () {
      Object.keys(grades).forEach(function (k) { delete grades[k]; }); persist();
      Array.prototype.forEach.call(ws.querySelectorAll(".gbtn.on"), function (b) { b.classList.remove("on"); });
      refreshScore();
    };
    Array.prototype.forEach.call(ws.querySelectorAll(".gen-ans"), function (btn) {
      btn.onclick = async function () {
        var sec = btn.getAttribute("data-genans-sec"), idx = parseInt(btn.getAttribute("data-genans-idx"), 10);
        var item = activeS.content[sec] && activeS.content[sec][idx];
        if (!item) return;
        var qtext = typeof item === "string" ? item : (item.q || item.prompt || "");
        var orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = IC.spark + 'Generating…';
        try {
          var a = await generateItemAnswer(course, qtext);
          if (typeof item === "string") activeS.content[sec][idx] = { q: item, answer: a }; else item.answer = a;
          persist();
          var slot = btn.parentNode; slot.classList.remove("answer-none");
          slot.innerHTML = '<span class="answer-lbl">Answer</span>' + esc(a);
          var q = slot.parentNode;
          if (q && !q.classList.contains("reveal")) { setQReveal(q, true); syncToggle(); }
        } catch (e) { btn.disabled = false; btn.innerHTML = orig; alert("Couldn't generate an answer: " + e.message); }
      };
    });
    Array.prototype.forEach.call(ws.querySelectorAll(".q-source[data-src-mat]"), function (link) {
      link.onclick = function (e) { e.preventDefault(); };
    });
  }

  // ---------- LEADER wiring ----------
  function wireLeaderPage() {
    if (view.page === "lnew") { wireNewClassroom(); return; }
    if (view.page === "lclass") {
      var cl = currentClassroom(); if (!cl) return;
      wireRoomTabs();
      if (view.classroomTab === "people") wireLeaderPeople(cl);
      else if (view.classroomTab === "generate") wireLeaderGenerate(cl);
      else if (view.classroomTab === "questions") wireAskBoard(cl, true);
      else wireRoomMaterialAdd(cl);
      return;
    }
    Array.prototype.forEach.call(pageEl.querySelectorAll(".ccard[data-openroom]"), function (card) {
      card.onclick = function (e) {
        if (e.target.closest("[data-delroom]")) return;
        navigate({ page: "lclass", classroomId: card.getAttribute("data-openroom"), classroomTab: "materials", clSession: null });
      };
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll(".ccard [data-delroom]"), function (d) {
      d.onclick = function (e) { e.stopPropagation(); delClassroom(d.getAttribute("data-delroom")); };
    });
  }
  function wireNewClassroom() {
    var swRow = document.getElementById("swatchRow");
    if (swRow) swRow.onclick = function (e) {
      var b = e.target.closest(".sw"); if (!b) return;
      newColor = b.getAttribute("data-color");
      Array.prototype.forEach.call(swRow.querySelectorAll(".sw"), function (x) { x.classList.toggle("on", x === b); });
    };
    var name = document.getElementById("clName");
    var create = function () {
      var n = name.value.trim(); if (!n) { name.focus(); return; }
      var c = normalizeClassroom({ id: uid(), name: n, color: newColor, code: genCode(),
        leaderId: session.id, leaderName: session.name, createdAt: Date.now() });
      state.classrooms.push(c); persist();
      navigate({ page: "lclass", classroomId: c.id, classroomTab: "materials", clSession: null });
    };
    var btn = document.getElementById("createClassBtn");
    if (btn) btn.onclick = create;
    if (name) { name.onkeydown = function (e) { if (e.key === "Enter") create(); }; name.focus(); }
  }
  function wireRoomMaterialAdd(cl) {
    var addMat = document.getElementById("addRmBtn");
    var fileInput = document.getElementById("rmFile");
    var fileStatus = document.getElementById("rmStatus");
    var isPdf = function (f) { return f.type === "application/pdf" || /\.pdf$/i.test(f.name); };
    if (fileInput) fileInput.onchange = async function () {
      var f = fileInput.files[0]; if (!f) return;
      var nameEl = document.getElementById("rmName");
      if (nameEl && !nameEl.value) nameEl.value = f.name;
      if (isPdf(f)) {
        fileStatus.textContent = "Reading PDF…"; addMat.disabled = true;
        try {
          var extracted = await extractPdfText(f);
          document.getElementById("rmText").value = extracted;
          fileStatus.textContent = extracted ? "✓ Text extracted — review it, then upload."
            : (claudeReady() ? "No text found in that PDF." : "No readable text found — paste the text in manually.");
        } catch (e) { fileStatus.textContent = ""; alert("Couldn't read that PDF — " + e.message); }
        finally { addMat.disabled = false; }
        return;
      }
      var reader = new FileReader();
      reader.onload = function () { document.getElementById("rmText").value = reader.result; fileStatus.textContent = "✓ Loaded."; };
      reader.readAsText(f);
    };
    if (addMat) addMat.onclick = function () {
      var text = document.getElementById("rmText").value.trim();
      var nm = document.getElementById("rmName").value.trim() || ("material-" + (cl.materials.length + 1) + ".txt");
      if (!text) { alert("Add some material text first."); return; }
      cl.materials.push({ id: uid(), filename: nm, text: text, createdAt: Date.now() });
      persist(); renderPage();
    };
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-delrm]"), function (x) {
      x.onclick = function () {
        var id = x.getAttribute("data-delrm");
        cl.materials = cl.materials.filter(function (m) { return m.id !== id; });
        persist(); renderPage();
      };
    });
  }
  function wireLeaderPeople(cl) {
    var copy = document.getElementById("copyCodeBtn");
    if (copy) copy.onclick = function () {
      try {
        navigator.clipboard.writeText(cl.code);
        copy.innerHTML = IC.copy + "Copied!";
        setTimeout(function () { copy.innerHTML = IC.copy + "Copy code"; }, 1400);
      } catch (e) { alert("Class code: " + cl.code); }

    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-kick]"), function (b) {

        var id = b.getAttribute("data-kick");

  function wireLeaderGenerate(cl) {

      try {

  function wireWorksheetMode(cl) {
    var gen = document.getElementById("roomGenBtn"), topic = document.getElementById("roomTopicInput");
    async function runGenerate(t, trigger) {
      t = (t || "").trim();
      if (!t) { alert("Pick a topic or type a request."); return; }
      var btn = trigger || gen, orig = btn.innerHTML;
      gen.disabled = true; btn.disabled = true; btn.innerHTML = IC.wand + 'Generating…';
      try {
        var s = await generateSession(cl, t);
        cl.sessions.push(s); view.clSession = s.id; persist(); renderPage();
      } catch (e) {
        alert("Session generation failed: " + e.message);
        gen.disabled = false; btn.disabled = false; btn.innerHTML = orig;
      }
    }
    if (gen) gen.onclick = function () { runGenerate(topic.value, gen); };
    if (topic) topic.onkeydown = function (e) { if (e.key === "Enter") runGenerate(topic.value, gen); };
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-roomtopic]"), function (chip) {
      chip.onclick = function () { runGenerate(chip.getAttribute("data-roomtopic"), chip); };
    });
    var sel = document.getElementById("roomSessionSelect");

    var del = document.getElementById("roomSessionDel");

      if (!active || !confirm("Delete “" + active.topic + "”? Students will no longer see it.")) return;
      cl.sessions = cl.sessions.filter(function (s) { return s.id !== active.id; });
      view.clSession = null; view.editSession = null; persist(); renderPage();
    };
    var active = cl.sessions[cl.sessions.length - 1];
    if (view.clSession) active = cl.sessions.find(function (s) { return s.id === view.clSession; }) || active;
    if (active) { if (!active.grades) active.grades = {}; wireWorksheet(cl, active, active.grades); wireSessionEditor(active); }

  function wirePlanMode(cl) {

    async function runPlan(t, trigger) {
      t = (t || "").trim();
      if (!t) { alert("Type a session focus, or pick a topic."); return; }
      var btn = trigger || gen, orig = btn.innerHTML;
      gen.disabled = true; btn.disabled = true; btn.innerHTML = IC.wand + 'Building plan…';
      try {
        var p = await generateSessionPlan(cl, t);
        cl.plans.push(p); view.clPlan = p.id; view.editPlan = null; persist(); renderPage();
      } catch (e) {
        alert("Plan generation failed: " + e.message);

    if (input) input.onkeydown = function (e) { if (e.key === "Enter") runPlan(input.value, gen); };

    var regenBtn = document.getElementById("planRegenBtn");
    if (regenBtn) regenBtn.onclick = async function () {

      var orig = regenBtn.innerHTML; regenBtn.disabled = true; regenBtn.innerHTML = IC.wand + 'Regenerating…';

    };
    var postBtn = document.getElementById("planPostBtn");
    if (postBtn) postBtn.onclick = async function () {
      var orig = postBtn.innerHTML; postBtn.disabled = true; postBtn.innerHTML = IC.school + (plan.posted ? 'Updating…' : 'Posting…');
      try {
        await postPlanAsVirtual(cl, plan);
        persist(); renderPage();
      } catch (e) { alert("Couldn't post as a virtual session: " + e.message); postBtn.disabled = false; postBtn.innerHTML = orig; }
    };

  function wirePlanEditor(cl, plan) {
    function readInto() {
      var c = plan.content || (plan.content = {});
      var top = document.getElementById("pedTopic"); if (top && top.value.trim()) plan.topic = top.value.trim();
      var obj = document.getElementById("pedObjectives"); c.objectives = obj ? obj.value.trim() : c.objectives;
      var mat = document.getElementById("pedMaterials");
      c.materialsNeeded = mat ? mat.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean) : c.materialsNeeded;
      var rem = document.getElementById("pedReminder"); c.leaderReminder = rem ? rem.value.trim() : c.leaderReminder;
      var acts = [];
      Array.prototype.forEach.call(document.querySelectorAll(".ped-act"), function (row) {
        function v(cls) { var el = row.querySelector(cls); return el ? el.value.trim() : ""; }
        var idx = parseInt(row.getAttribute("data-ped-idx"), 10);
        var orig = (c.activities || [])[idx] || {};
        acts.push({
          title: v(".ped-title"), role: orig.role || "main",
          objective: v(".ped-objective"), clt: v(".ped-clt"), strategy: v(".ped-strategy"),
          duration: v(".ped-duration"), references: v(".ped-references"),
          cfu: v(".ped-cfu"), breakdown: v(".ped-breakdown")
        });
      });
      c.activities = acts;
    }
    var add = document.getElementById("pedAddAct");
    if (add) add.onclick = function () {
      readInto();
      plan.content.activities.push({ title: "Main Activity", role: "main", objective: "", clt: "", strategy: "", duration: "", references: "", cfu: "", breakdown: "" });
      persist(); renderPage();
    };
    Array.prototype.forEach.call(document.querySelectorAll(".ed-del[data-ped-del]"), function (b) {
      b.onclick = function () {
        readInto();
        plan.content.activities.splice(parseInt(b.getAttribute("data-ped-del"), 10), 1);
        persist(); renderPage();
      };
    });
    var save = document.getElementById("pedSave");
    if (save) save.onclick = function () {
      readInto();
      if (plan.posted && plan.postedSessionId) syncPostedSession(cl, plan);
      view.editPlan = null; persist(); renderPage();
    };
    var cancel = document.getElementById("pedCancel");
    if (cancel) cancel.onclick = function () { view.editPlan = null; renderPage(); };
  }

  // Push a plan's current content onto its already-posted worksheet session, so
  // "Update virtual session" / edits / regenerate refresh what students see.
  function syncPostedSession(cl, plan) {
    var s = cl.sessions.find(function (x) { return x.id === plan.postedSessionId; });
    if (s) { s.plan = deepCopy(plan); s.topic = plan.topic; }
  }

  // Post an in-person plan as a virtual session: attach the plan to a worksheet
  // (generating the practice Q&A the first time) and publish it to students.
  async function postPlanAsVirtual(cl, plan) {
    var existing = plan.postedSessionId && cl.sessions.find(function (x) { return x.id === plan.postedSessionId; });
    if (existing) { syncPostedSession(cl, plan); plan.posted = true; return existing; }
    var s = await generateSession(cl, plan.topic);
    s.plan = deepCopy(plan);
    cl.sessions.push(s);
    plan.posted = true; plan.postedSessionId = s.id;
    return s;
  }

  // ---------- STUDENT classroom wiring ----------
  function wireStudentClassrooms() {
    var join = document.getElementById("joinBtn"), codeInp = document.getElementById("joinCode");
    var doJoin = function () {
      var code = (codeInp.value || "").trim().toUpperCase();
      if (!code) { codeInp.focus(); return; }
      var cl = findClassroomByCode(code);
      if (!cl) { alert("No classroom found with code " + code + ". Double-check the code with your SI leader."); return; }
      if (!isMember(cl)) { cl.members.push({ id: session.id, name: session.name, joinedAt: Date.now() }); persist(); }
      navigate({ page: "classroom", classroomId: cl.id, tab: "materials", activeSession: null, sessionSuggestions: null });
    };
    if (join) join.onclick = doJoin;
    if (codeInp) codeInp.onkeydown = function (e) { if (e.key === "Enter") doJoin(); };
    Array.prototype.forEach.call(pageEl.querySelectorAll(".ccard[data-openroom]"), function (card) {
      card.onclick = function (e) {

        navigate({ page: "classroom", classroomId: card.getAttribute("data-openroom"), tab: "materials", activeSession: null, sessionSuggestions: null });
      };
    });

      b.onclick = function (e) { e.stopPropagation(); leaveClassroom(b.getAttribute("data-leaveroom")); };

  // Wire the shared material-upload card (file → text extraction). Used by both
  // personal courses and classrooms; the add/delete handlers are wired by the
  // caller since they target different stores.
  function wireMaterialFileInput() {
    var fileInput = document.getElementById("matFile");
    if (!fileInput) return;
    var fileStatus = document.getElementById("fileStatus");
    var addMat = document.getElementById("addMatBtn");
    var isPdf = function (f) { return f.type === "application/pdf" || /\.pdf$/i.test(f.name); };
    fileInput.onchange = async function () {
      var f = fileInput.files[0]; if (!f) return;
      var nameEl = document.getElementById("matName");
      if (nameEl && !nameEl.value) nameEl.value = f.name;
      if (isPdf(f)) {
        fileStatus.textContent = "Reading PDF…"; if (addMat) addMat.disabled = true;
        try {
          var extracted = await extractPdfText(f);
          document.getElementById("matText").value = extracted;
          fileStatus.textContent = extracted ? "✓ Text extracted — review it, then add."
            : (claudeReady() ? "No text found in that PDF." : "No readable text found. This looks like a scanned PDF — paste the text in manually.");
        } catch (e) { fileStatus.textContent = ""; alert("Couldn't read that PDF — " + e.message); }
        finally { if (addMat) addMat.disabled = false; }
        return;
      }
      var reader = new FileReader();
      reader.onload = function () { document.getElementById("matText").value = reader.result; fileStatus.textContent = "✓ Loaded."; };
      reader.readAsText(f);
    };
  }
  // Classroom Materials tab: add/remove the student's PRIVATE files (en.privateMats).
  function wireClassroomMaterialAdd(cl, en) {
    wireMaterialFileInput();
    var addMat = document.getElementById("addMatBtn");
    if (addMat) addMat.onclick = function () {
      var text = document.getElementById("matText").value.trim();
      var nm = document.getElementById("matName").value.trim() || ("my-material-" + (en.privateMats.length + 1) + ".txt");
      if (!text) { alert("Add some material text first."); return; }
      en.privateMats.push({ id: uid(), filename: nm, text: text, createdAt: Date.now() });
      persist(); renderPage();
      autoExtractContacts(enrolled(cl));
    };
    Array.prototype.forEach.call(pageEl.querySelectorAll("[data-delprivmat]"), function (x) {
      x.onclick = function () {
        var id = x.getAttribute("data-delprivmat");
        en.privateMats = en.privateMats.filter(function (m) { return m.id !== id; });

  function displayName(c) {
    var full = [c.firstName, c.lastName].filter(Boolean).join(" ").trim();
    return full || c.name || "Unnamed";
  }
  function contactInitials(c) {
    if (c.firstName || c.lastName) {
      return ((c.firstName ? c.firstName[0] : "") + (c.lastName ? c.lastName[0] : "")).toUpperCase() || "?";
    }
    var parts = String(c.name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  // The "section" field means different things per role, so label it to match.
  function sectionLabel(role) {
    var r = String(role || "").toLowerCase();
    if (/teaching assistant|\bta\b|grader/.test(r)) return "Sections / students they cover";
    if (/si|peer leader|pltl/.test(r)) return "Session days & times";
    if (/professor|instructor|lecturer/.test(r)) return "Section they teach";
    return "Section / assignment";
  }
